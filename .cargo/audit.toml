# cargo-audit configuration for the legacy Rust gateway in src/.
# Run locally:  cargo audit
# CI: .github/workflows/cargo-audit.yml (every day, on demand, and as a required check of pull requests and the
# merge queue when they change the Rust dependencies).
#
# Policy: no advisory is ignored. If one cannot be fixed by an update, replace the crate or
# patch it (see [patch.crates-io] in Cargo.toml) rather than adding an entry here.

[advisories]
ignore = []
