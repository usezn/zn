# cargo-audit configuration for the legacy Rust gateway in src/.
# Run locally:  cargo audit
# CI: .github/workflows/rust.yml (audit job, also weekly).
#
# Policy: every entry below is a dependency that CANNOT be updated today.
# Each entry lists the pulling crate(s) and why an update or fix is not
# currently possible. Revisit on every major dependency bump.

[advisories]
ignore = [
    # rsa has NO fixed release upstream (Marvin timing side channel, open since
    # 2023). Pulled by jsonwebtoken's rust_crypto backend; the gateway only
    # validates HMAC-signed tokens and never uses RSA keys.
    "RUSTSEC-2023-0071", # rsa 0.9.10: Marvin Attack; no patched release; RSA path unused

    # --- Unmaintained / unsound, transitive, no drop-in replacement available ---
    # pqcrypto-* is zn's Dilithium (post-quantum signing) implementation;
    # successor pqcrypto-mldsa is an API-breaking migration, tracked separately.
    "RUSTSEC-2024-0380", # pqcrypto-dilithium replaced by pqcrypto-mldsa; deliberate pin for Dilithium signatures
    "RUSTSEC-2026-0163", # pqcrypto-internals unmaintained (PQClean archived); required by pqcrypto-dilithium
    "RUSTSEC-2026-0162", # pqcrypto-traits unmaintained (PQClean archived); required by pqcrypto-dilithium

    # paste is a proc-macro used at build time only; via gemm <- candle-core.
    "RUSTSEC-2024-0436", # paste unmaintained (proc-macro, build-time only)

    # number_prefix via indicatif <- cliclack/hf-hub (progress-bar formatting).
    "RUSTSEC-2025-0119", # number_prefix unmaintained; cosmetic CLI progress formatting only
]
