# Rust gateway checks (build, test, clippy, fmt, MSRV, cargo audit, coverage) on pushes and pull requests; steps are skipped when no Rust file changed.
name: Rust gateway

on:
  push:
    # release/** is here, and there is no paths filter, because tag-release.yml requires "build, test, clippy,
    # fmt" on the exact release commit, whatever that commit changed. rust-scope.sh runs every push in full.
    branches: [main, next, 'release/**']
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled, ready_for_review ]
    # No paths filter here: "build, test, clippy, fmt" is a required check, and a workflow skipped by a
    # paths filter leaves it pending. rust-scope.sh skips the steps when no Rust file changed instead.
  # The merge queue on next runs the required checks again on the queued commit; rust-scope.sh compares
  # it with the group's base commit, so a group with no Rust change skips the steps like a pull request.
  merge_group:
    types: [ checks_requested ]
  schedule:
    - cron: "17 6 * * 1" # weekly advisory check
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keeps each Rust build cache small, so that the five of them (Linux check, MSRV and coverage, Windows and
  # macOS private file writer) plus the copy that is still there after a Cargo.lock change fit in the repository
  # 10 GB cache limit. Debug info is the largest part of target/ (on Windows it is the .pdb files) and nothing
  # in these jobs reads it: the tests set RUST_BACKTRACE=0 and panic messages carry the file and line without it.
  # CARGO_INCREMENTAL=0 is what rust-cache sets anyway; stated here so the cache key does not depend on it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

# A new push to a pull request, or to next, cancels the run still going for it, so a burst of
# merges into next tests only the newest commit. Runs for main, scheduled runs and manual runs always complete.
concurrency:
  group: rust-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  check:
    name: build, test, clippy, fmt
    # A required check with a literal name: a job skipped by its if reports under this exact name, as skipped,
    # and a skipped job counts as passed for a required check.
    # Skipped on pull requests into next without the full-ci label (the merge queue runs it before the merge) and
    # on draft pull requests (marking the pull request ready for review runs it). A push to next is the commit the
    # merge queue already checked, so it is skipped there too. It runs in the merge queue, on pull requests into
    # main and release branches, on pushes to main and release branches, on the weekly schedule, on manual runs and
    # on pull requests labelled full-ci.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/next') && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.base_ref != 'next' || contains(github.event.pull_request.labels.*.name, 'full-ci')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - name: Test the scope scripts
        run: bash .github/scripts/test-ci-scope.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.rust == 'true'
        with:
          # Pinned so a new stable release cannot fail CI through new lints.
          # Bump deliberately; the minimum supported version is rust-version
          # in Cargo.toml.
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Install protoc 29.3 (checksum verified)
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.rust == 'true'
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          # Each Rust cache is 1.5 to 3 GB, so only main saves one. next and pull requests
          # restore the cache of main (same key prefix) and save nothing, which keeps the
          # repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: clippy
        if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: build
        if: steps.scope.outputs.rust == 'true'
        run: cargo build --locked
      - name: test
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --locked

  private-file:
    name: private file writer (${{ matrix.os }})
    # The owner-only file writer has a separate Windows implementation (protected DACL) and platform-specific
    # Unix code (file permissions), so its tests also run on Windows and macOS. Not a required check. It runs on
    # pushes to main, next and release branches, on the schedule and on manual runs (the scope job always says yes
    # there), in pull requests into main or a release branch and in pull requests with the full-ci label (always),
    # and in other pull requests only when they change Rust code or Cargo files, so a pull request into next that
    # changes none does not start a Windows or macOS runner. The merge queue runs only the required checks, so it
    # skips this job. Draft pull requests skip it (through scope).
    needs: scope
    if: github.event_name != 'merge_group' && (needs.scope.outputs.rust == 'true' || (github.event_name == 'pull_request' && (github.base_ref != 'next' || contains(github.event.pull_request.labels.*.name, 'full-ci'))))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.rust == 'true'
        with:
          toolchain: 1.99.0
      - name: Install protoc 29.3 (checksum verified)
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.rust == 'true'
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test private_file
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --locked --lib private_file

  scope:
    name: Rust scope
    # One cheap job decides whether the change touches Rust. The jobs that are not required (MSRV, cargo audit) need it
    # and are skipped without taking a runner when it says no: on a pull request that changes no Rust file they used to
    # start, check out and stop. The required "build, test, clippy, fmt" keeps its own check, so it always reports.
    # It also runs in the merge queue, because cargo audit (a security check) still gates the merge there; MSRV and
    # the private file writer skip the queue on their own.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh

  msrv:
    name: minimum supported Rust version (1.95)
    # Draft pull requests skip this job (through scope); a change that touches no Rust file skips it too. The merge
    # queue runs only the required checks, so the commit merged into next is checked here, on the push to next.
    needs: scope
    if: github.event_name != 'merge_group' && needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.rust == 'true'
        with:
          # Must equal rust-version in Cargo.toml.
          toolchain: "1.95"
      - name: Install protoc 29.3 (checksum verified)
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.rust == 'true'
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: check the declared version matches
        if: steps.scope.outputs.rust == 'true'
        run: grep -q '^rust-version = "1.95"$' Cargo.toml
      - name: check
        if: steps.scope.outputs.rust == 'true'
        run: cargo check --locked --all-targets
      - name: test
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --locked

  audit:
    name: cargo audit
    # Draft pull requests skip this job (through scope); a change that touches no Rust file skips it too. Unlike the
    # other jobs that are not required, it also runs in the merge queue: a new RustSec advisory must stop a merge into
    # next, not show up only after it.
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: steps.scope.outputs.rust == 'true'
        with:
          tool: cargo-audit
      - name: cargo audit
        if: steps.scope.outputs.rust == 'true'
        run: cargo audit

  coverage:
    name: coverage report
    # Report only, no threshold, and it repeats the build and tests, so it runs on every push (main, next and
    # release branches) and on manual runs, not on pull requests or the weekly schedule.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - name: Install protoc 29.3 (checksum verified)
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - name: Run the tests with a coverage report
        # The same tests as the test step above, measured with cargo-llvm-cov. Report only, no threshold.
        run: |
          set -o pipefail
          cargo llvm-cov --locked --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
          cargo llvm-cov report --locked 2>&1 | tee "$RUNNER_TEMP/coverage-rust.log"
          {
            echo '### zn-gate (Rust) coverage'
            echo '```'
            grep -E '^TOTAL' "$RUNNER_TEMP/coverage-rust.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: ${{ runner.temp }}/coverage-rust.lcov
          if-no-files-found: ignore
          retention-days: 14
