name: Rust gateway

on:
  push:
    # release/** is here, and there is no paths filter, because tag-release.yml requires "build, test, clippy,
    # fmt" on the exact release commit, whatever that commit changed. rust-scope.sh runs every push in full.
    branches: [main, next, 'release/**']
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    # No paths filter here: "build, test, clippy, fmt" is a required check, and a workflow skipped by a
    # paths filter leaves it pending. rust-scope.sh skips the steps when no Rust file changed instead.
  # The merge queue on next runs the required checks again on the queued commit; rust-scope.sh compares
  # it with the group's base commit, so a group with no Rust change skips the steps like a pull request.
  merge_group:
    types: [ checks_requested ]
  schedule:
    - cron: "17 6 * * 1" # weekly advisory check
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it, so a burst of
# merges into next tests only the newest commit. Runs for main, scheduled runs and manual runs always complete.
concurrency:
  group: rust-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  check:
    name: build, test, clippy, fmt
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    # A push to next is the commit the merge queue already checked: the jobs and legs the queue ran on that commit
    # (the required checks) are skipped there; the push runs only what the queue does not.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - name: Test the scope scripts
        run: bash .github/scripts/test-ci-scope.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.rust == 'true'
        with:
          # Pinned so a new stable release cannot fail CI through new lints.
          # Bump deliberately; the minimum supported version is rust-version
          # in Cargo.toml.
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Install protoc 29.3 (checksum verified)
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning] release pushes set lookup-only, so they neither restore nor save a cache
        if: steps.scope.outputs.rust == 'true'
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          # Each Rust cache is 1.5 to 3 GB, so only main saves one. next and pull requests
          # restore the cache of main (same key prefix) and save nothing, which keeps the
          # repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: clippy
        if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: build
        if: steps.scope.outputs.rust == 'true'
        run: cargo build --locked
      - name: test
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --locked

  private-file:
    name: private file writer (${{ matrix.os }})
    # The owner-only file writer has a separate Windows implementation (protected DACL) and platform-specific
    # Unix code, so its tests also run on Windows and macOS. Not a required check. Pull requests into next leave it
    # out (the shared runner pool is the bottleneck: those pull requests run the required checks and one Windows job,
    # "Windows (Node.js 22)"); the merge queue, pushes to main, next and release branches, the schedule, pull
    # requests into main or release branches and the full-ci label run both systems. Draft pull requests skip it.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'pull_request' && github.base_ref == 'next' && !contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.rust == 'true'
        with:
          toolchain: 1.99.0
      - name: Install protoc 29.3 (checksum verified)
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning] release pushes set lookup-only, so they neither restore nor save a cache
        if: steps.scope.outputs.rust == 'true'
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test private_file
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --locked --lib private_file

  scope:
    name: Rust scope
    # One cheap job decides whether the change touches Rust. The jobs that are not required (MSRV, cargo audit) need it
    # and are skipped without taking a runner when it says no: on a pull request that changes no Rust file they used to
    # start, check out and stop. The required "build, test, clippy, fmt" keeps its own check, so it always reports.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh

  msrv:
    name: minimum supported Rust version (1.95)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    # Draft pull requests skip this job (through scope); a change that touches no Rust file skips it too. A push to
    # next is the commit the merge queue already checked, so it is skipped there as well.
    needs: scope
    if: needs.scope.outputs.rust == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.scope.outputs.rust == 'true'
        with:
          # Must equal rust-version in Cargo.toml.
          toolchain: "1.95"
      - name: Install protoc 29.3 (checksum verified)
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning] release pushes set lookup-only, so they neither restore nor save a cache
        if: steps.scope.outputs.rust == 'true'
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: check the declared version matches
        if: steps.scope.outputs.rust == 'true'
        run: grep -q '^rust-version = "1.95"$' Cargo.toml
      - name: check
        if: steps.scope.outputs.rust == 'true'
        run: cargo check --locked --all-targets
      - name: test
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --locked

  audit:
    name: cargo audit
    # Draft pull requests skip this job (through scope); a change that touches no Rust file skips it too. A push to
    # next is the commit the merge queue already checked, so it is skipped there as well.
    needs: scope
    if: needs.scope.outputs.rust == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash .github/scripts/rust-scope.sh
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.scope.outputs.rust == 'true'
        with:
          tool: cargo-audit
      - name: cargo audit
        if: steps.scope.outputs.rust == 'true'
        run: cargo audit

  coverage:
    name: coverage report
    # Report only, no threshold, and it repeats the build and tests, so it runs on pushes to main and next
    # and on manual runs, not on pull requests or the weekly schedule.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - name: Install protoc 29.3 (checksum verified)
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning] release pushes set lookup-only, so they neither restore nor save a cache
        with:
          # Release pushes never restore or save a cache that a pull request could have poisoned.
          lookup-only: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - name: Run the tests with a coverage report
        # The same tests as the test step above, measured with cargo-llvm-cov. Report only, no threshold.
        run: |
          set -o pipefail
          cargo llvm-cov --locked --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
          cargo llvm-cov report --locked 2>&1 | tee "$RUNNER_TEMP/coverage-rust.log"
          {
            echo '### zn-gate (Rust) coverage'
            echo '```'
            grep -E '^TOTAL' "$RUNNER_TEMP/coverage-rust.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: ${{ runner.temp }}/coverage-rust.lcov
          if-no-files-found: ignore
          retention-days: 14
