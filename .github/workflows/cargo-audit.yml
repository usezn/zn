name: Cargo audit

# Checks the Rust dependencies of the legacy gateway in src/ against the RustSec advisory database.
# "cargo audit" is meant to be a required check of pull requests into next; it is added to the branch rules right
# after this workflow lands, and the merge queue runs it too. It audits only a
# change to the Rust dependencies (Cargo.lock, any Cargo.toml, .cargo/audit.toml or this workflow): any other pull request
# passes it at once, so an advisory published on an unrelated day does not hold up the queue. The job runs on every
# pull request and merge queue group, with no paths filter, because a required check skipped by a filter would stay
# pending. It also runs every day on main and every night on next, on a push to main or next that changes those
# files, and on demand. When a run outside pull requests and the merge queue fails, one issue is opened (or the open
# one gets a comment), so a new advisory is still seen the same day. The advisory ignore list is .cargo/audit.toml.
on:
  push:
    branches: [main, next]
    paths: ["Cargo.lock", "Cargo.toml", "**/Cargo.toml", ".cargo/audit.toml", ".github/workflows/cargo-audit.yml"]
  pull_request:
    branches: [main, next, 'release/**']
  merge_group:
  schedule:
    - cron: "47 6 * * *" # daily advisory check on main
    - cron: "52 3 * * *" # nightly advisory check on next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The nightly schedule audits next; every other run audits the commit that started it.
          ref: ${{ github.event.schedule == '52 3 * * *' && 'next' || '' }}
          persist-credentials: false
      - name: Decide whether the Rust dependencies changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        # Outside pull requests and the merge queue, and whenever the changed files cannot be listed, the audit runs.
        run: |
          set -uo pipefail
          out() { echo "audit=$1"; echo "audit=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT_NAME" in pull_request|merge_group) ;; *) out true ;; esac
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || out true
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || out true
          files="$(git diff --no-renames --name-only "$BASE_SHA" HEAD 2>/dev/null)" || out true
          if grep -qxE 'Cargo\.lock|(.*/)?Cargo\.toml|\.cargo/audit\.toml|\.github/workflows/cargo-audit\.yml' <<< "$files"; then out true; fi
          echo "No Rust dependency file changed: nothing to audit for this change."
          out false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: steps.scope.outputs.audit == 'true'
        with:
          tool: cargo-audit
      - name: cargo audit
        if: steps.scope.outputs.audit == 'true'
        run: cargo audit

  # Opens one issue when a run outside pull requests and the merge queue fails, or adds a comment to the open one. It uses the run's own
  # token (issues: write on this job only) and no secrets, and it needs no checkout: gh reads the repository name
  # from GH_REPO. A pull request shows the failure on the pull request itself.
  alert-on-failure:
    name: open or update the advisory issue
    if: github.repository == 'usezn/zn' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && failure()
    needs: [audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Rust dependency advisory found by cargo audit
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_REF: ${{ github.event.schedule == '52 3 * * *' && 'next' || github.ref_name }}
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Open or update the advisory issue
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Rust dependency advisory found by cargo audit") | .number' | head -n 1)"
          cat > "$RUNNER_TEMP/body.md" <<BODY
          cargo audit failed on ${RUN_REF}: ${RUN_URL}

          Open the step "cargo audit" in that run to see the advisories. Either a dependency has a new advisory (update it, or
          add it to .cargo/audit.toml with the reason when no update is possible), or the advisory database could not be
          fetched (run the job again).

          Pull requests that do not change the Rust dependencies are not held up by it. This issue stays open until
          someone closes it. Each later failed run adds a comment with its link.
          BODY
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
            echo "Commented on issue #$number"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
