# Install of the packed npm tarball on the oldest Node.js versions the docs promise, on pull requests that change the package.
name: Oldest Node.js install

# The docs say Node.js 18 or later works for the hooks and the CLI, and that the Claude Code plugin needs 20.19 or
# later. This workflow packs the zn-gate npm package, installs the tarball the way a user does (npm install, with
# lifecycle scripts) on Node.js 18.0.0 (the floor of the engines field), the latest 18.x and 20.19.0, then runs
# zn-gate --version, the built-in offline self-test and a vault smoke test (fake passphrase, fake secret, in a temp
# home). Pull requests that change none of the paths below do not run it. Not a required check; the merge queue does
# not run it. A manual run runs it on any branch.
on:
  pull_request:
    branches: [ next, main, 'release/**' ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'packages/zn-gate/**'
      - '.github/workflows/oldest-node-install.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for it.
concurrency:
  group: oldest-node-install-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Retry npm downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  pack:
    name: Pack the npm tarball
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Pack
        working-directory: packages/zn-gate
        run: |
          set -euo pipefail
          # npm pack bundles only the dependencies that are installed, and age-encryption (the vault's encryption
          # library) is a bundled dependency: install them first, without running their scripts.
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/tarball"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tarball"
          ls -l "$RUNNER_TEMP/tarball"
          # The tarball must carry the bundled library and the package's own entry points.
          tar -tzf "$RUNNER_TEMP"/tarball/zn-gate-*.tgz > "$RUNNER_TEMP/tarball-files.txt"
          for f in package/package.json package/bin/cli.js package/lib/vault/store.js \
            package/node_modules/age-encryption/package.json package/node_modules/age-encryption/dist/index.js; do
            grep -qxF "$f" "$RUNNER_TEMP/tarball-files.txt" || { echo "missing from the tarball: $f"; exit 1; }
          done
          echo "files in the tarball: $(wc -l < "$RUNNER_TEMP/tarball-files.txt")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zn-gate-tarball
          path: ${{ runner.temp }}/tarball/zn-gate-*.tgz
          retention-days: 1
          if-no-files-found: error

  install:
    name: Install on Node.js ${{ matrix.node-version }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 18.0.0 is the floor of the engines field; 20.19.0 is the floor of the Claude Code plugin.
        node-version: ["18.0.0", "18.x", "20.19.0"]
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zn-gate-tarball
          path: ${{ runner.temp }}/tarball
      - name: Install the tarball, check the version and run the self-test
        run: |
          set -euo pipefail
          node --version
          npm --version
          # A clean project and home, so nothing from the runner leaks in.
          work="$RUNNER_TEMP/consumer"
          mkdir -p "$work/home"
          cd "$work"
          export HOME="$work/home"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tarball/zn-gate-*.tgz
          bin=./node_modules/.bin/zn-gate
          "$bin" --version | tee version.txt
          grep -Eq '^zn-gate [0-9]+\.[0-9]+\.[0-9]+' version.txt
          # Offline self-test of the rules engine: no network, no account, no files outside HOME.
          "$bin" test
      - name: Vault smoke (fake passphrase, fake secret, temp home)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/consumer"
          export HOME="$work/home"
          bin="$work/node_modules/.bin/zn-gate"
          trap '"$bin" lock > /dev/null 2>&1 || true' EXIT
          # Fake passphrase and fake value only. The vault is created in the temp home, never in the runner's.
          printf '%s' 'fake-ci-passphrase-0123' | "$bin" unlock --passphrase-stdin --backend passphrase --ttl 10m
          # secret set needs a terminal: script provides one, and the value comes from the piped input.
          # The terminal echoes the typed value back: keep that echo out of the log.
          printf 'FAKE_TEST_VALUE\n' | script -qfec "\"$bin\" secret set CI_FAKE_TOKEN --mode env" /dev/null > /dev/null
          "$bin" secret list | tee secrets.txt
          grep -q 'CI_FAKE_TOKEN' secrets.txt
          "$bin" lock
          trap - EXIT
