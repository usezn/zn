# Fails a pull request that changes the workflows or scope scripts the required checks come from, unless a maintainer approved it.
name: Trusted CI files guard

# Started by pull_request_target, so GitHub runs this file from the base branch: a pull request cannot empty
# this check by editing it. The job never checks out or runs code of the pull request; it lists the changed file
# names through the API (.github/scripts/trusted-ref-guard.mjs, taken from the base branch too).
# The merge queue has no pull request: the job reports success there, because the pull request was checked when
# it entered the queue and a required check must always report.
on:
  pull_request_target:
    types: [ opened, synchronize, reopened, labeled, unlabeled, ready_for_review ]
    branches: [ main, next, 'release/**' ]
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-ci-guard-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  guard:
    name: Trusted CI files guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # pull_request_target checks out the base branch by default; the head of the pull request is never fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request_target'
        with:
          persist-credentials: false
      - name: Require approval for changes to protected CI files
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Comma-separated GitHub logins whose label or approval counts.
          APPROVERS: tljohnsilver
        run: node .github/scripts/trusted-ref-guard.mjs
      - name: Merge queue
        if: github.event_name == 'merge_group'
        run: echo "Checked when the pull request entered the queue."
