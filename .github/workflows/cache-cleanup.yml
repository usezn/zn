name: Cache cleanup

# Deletes the Actions caches of pull requests that are closed (merged or not). A pull request run
# saves its caches under refs/pull/<number>/merge, and only that pull request can use them, so once
# it is closed they only take space from the repository's 10 GB cache limit. Merge queue runs save
# theirs under refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>, a branch GitHub deletes when the
# run ends, so those caches are deleted once their branch is gone. Caches of other branches and of
# tags, of open pull requests and of merge queue runs still going are never touched. It runs weekly
# and on demand. It deliberately has no pull_request trigger: that event runs the workflow file as
# the pull request has it, so a same-repository branch could use this job's actions: write token.
on:
  schedule:
    - cron: "41 4 * * 0" # weekly, Sunday 04:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting anything"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  closed-pull-requests:
    name: Delete caches of closed pull requests and finished merge queue runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # list and delete caches
      pull-requests: read # check that a pull request is closed before deleting its caches
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Delete caches of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Scheduled runs have no inputs and delete; manual runs delete only when dry_run is unchecked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          # Empty on scheduled and manual runs; kept so a single pull request can be targeted.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/caches.tsv"
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .ref, .size_in_bytes] | @tsv' > "$list"

          rows="$RUNNER_TEMP/rows.md"
          deleted=0; deleted_bytes=0; kept_open=0; failed=0
          queue_deleted=0; queue_deleted_bytes=0; queue_kept=0
          : > "$rows"

          # Deletes one cache (or only reports it in a dry run) and adds its row to the summary.
          delete_cache() { # <id> <size> <label>
            local action
            if [ "$DRY_RUN" = "true" ]; then
              action="would delete"
            elif gh api -X DELETE "repos/$REPO/actions/caches/$1" > /dev/null; then
              action="deleted"
            else
              echo "::warning::Could not delete cache $1 of $3."
              failed=$((failed + 1))
              return 1
            fi
            printf '| %s | %s | %s MB | %s |\n' "$3" "$1" "$(($2 / 1048576))" "$action" >> "$rows"
          }

          # Only refs of the exact form refs/pull/<number>/merge are considered.
          numbers=$(cut -f2 "$list" | grep -E '^refs/pull/[0-9]+/merge$' | cut -d/ -f3 | sort -un || true)
          if [ -n "${PR_NUMBER:-}" ]; then
            case "$PR_NUMBER" in *[!0-9]*) echo "::error::Unexpected pull request number."; exit 1 ;; esac
            numbers=$(printf '%s\n' "$numbers" | grep -x "$PR_NUMBER" || true)
          fi
          for number in $numbers; do
            if ! state=$(gh api "repos/$REPO/pulls/$number" --jq '.state'); then
              echo "::warning::Could not read the state of pull request #$number; its caches are kept."
              failed=$((failed + 1))
              continue
            fi
            if [ "$state" != "closed" ]; then
              kept_open=$((kept_open + 1))
              continue
            fi
            ref="refs/pull/$number/merge"
            while IFS=$'\t' read -r id cache_ref size; do
              [ "$cache_ref" = "$ref" ] || continue
              case "$id" in ''|*[!0-9]*) continue ;; esac
              case "$size" in ''|*[!0-9]*) size=0 ;; esac
              delete_cache "$id" "$size" "pull request #$number" || continue
              deleted=$((deleted + 1)); deleted_bytes=$((deleted_bytes + size))
            done < "$list"
          done

          # Merge queue runs: refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>. Only that ref can use
          # their caches. A branch that still exists is a run in progress and keeps its caches. If the
          # branches cannot be listed, nothing of the queue is deleted.
          queue_refs=$(cut -f2 "$list" | grep -E '^refs/heads/gh-readonly-queue/[A-Za-z0-9._/-]+$' | sort -u || true)
          if [ -n "${PR_NUMBER:-}" ]; then
            queue_refs=$(printf '%s\n' "$queue_refs" | grep -E "/pr-${PR_NUMBER}-[0-9a-f]+$" || true)
          fi
          if [ -n "$queue_refs" ]; then
            live="$RUNNER_TEMP/queue-branches.txt"
            if gh api --paginate "repos/$REPO/git/matching-refs/heads/gh-readonly-queue/" --jq '.[].ref' > "$live"; then
              for ref in $queue_refs; do
                if grep -qxF "$ref" "$live"; then
                  queue_kept=$((queue_kept + 1))
                  continue
                fi
                while IFS=$'\t' read -r id cache_ref size; do
                  [ "$cache_ref" = "$ref" ] || continue
                  case "$id" in ''|*[!0-9]*) continue ;; esac
                  case "$size" in ''|*[!0-9]*) size=0 ;; esac
                  delete_cache "$id" "$size" "merge queue ${ref#refs/heads/gh-readonly-queue/}" || continue
                  queue_deleted=$((queue_deleted + 1)); queue_deleted_bytes=$((queue_deleted_bytes + size))
                done < "$list"
              done
            else
              echo "::warning::Could not list the merge queue branches; their caches are kept."
              failed=$((failed + 1))
            fi
          fi

          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Cache cleanup (dry run, nothing deleted)"
            else
              echo "## Cache cleanup"
            fi
            echo
            echo "Caches of closed pull requests: $deleted ($((deleted_bytes / 1048576)) MB)."
            echo "Pull requests still open, caches kept: $kept_open."
            echo "Caches of finished merge queue runs: $queue_deleted ($((queue_deleted_bytes / 1048576)) MB)."
            echo "Merge queue runs still going, caches kept: $queue_kept."
            echo "Errors: $failed."
            if [ -s "$rows" ]; then
              echo
              echo "| Cache of | Cache id | Size | Action |"
              echo "| --- | --- | --- | --- |"
              cat "$rows"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed lookups or deletions failed; see the warnings above."
            exit 1
          fi
