name: Cache cleanup

# Deletes the Actions caches of pull requests that are closed (merged or not). A pull request run
# saves its caches under refs/pull/<number>/merge, and only that pull request can use them, so once
# it is closed they only take space from the repository's 10 GB cache limit. Caches of branches and
# tags, and of open pull requests, are never touched. It runs when a pull request is closed (only that
# pull request's caches) and weekly for anything left behind.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 4 * * 0" # weekly, Sunday 04:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting anything"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  closed-pull-requests:
    name: Delete caches of closed pull requests
    # A pull request from a fork gets a read-only token, so its caches are left to the weekly run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # list and delete caches
      pull-requests: read # check that a pull request is closed before deleting its caches
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Delete caches of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Scheduled runs have no inputs and delete; manual runs delete only when dry_run is unchecked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          # Set only when a pull request was just closed: then only its caches are looked at.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/caches.tsv"
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .ref, .size_in_bytes] | @tsv' > "$list"

          rows="$RUNNER_TEMP/rows.md"
          deleted=0; deleted_bytes=0; kept_open=0; failed=0
          : > "$rows"

          # Only refs of the exact form refs/pull/<number>/merge are considered.
          numbers=$(cut -f2 "$list" | grep -E '^refs/pull/[0-9]+/merge$' | cut -d/ -f3 | sort -un || true)
          if [ -n "${PR_NUMBER:-}" ]; then
            case "$PR_NUMBER" in *[!0-9]*) echo "::error::Unexpected pull request number."; exit 1 ;; esac
            numbers=$(printf '%s\n' $numbers | grep -x "$PR_NUMBER" || true)
          fi
          for number in $numbers; do
            if ! state=$(gh api "repos/$REPO/pulls/$number" --jq '.state'); then
              echo "::warning::Could not read the state of pull request #$number; its caches are kept."
              failed=$((failed + 1))
              continue
            fi
            if [ "$state" != "closed" ]; then
              kept_open=$((kept_open + 1))
              continue
            fi
            ref="refs/pull/$number/merge"
            while IFS=$'\t' read -r id cache_ref size; do
              [ "$cache_ref" = "$ref" ] || continue
              case "$id" in ''|*[!0-9]*) continue ;; esac
              case "$size" in ''|*[!0-9]*) size=0 ;; esac
              if [ "$DRY_RUN" = "true" ]; then
                action="would delete"
              elif gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null; then
                action="deleted"
              else
                echo "::warning::Could not delete cache $id of pull request #$number."
                failed=$((failed + 1))
                continue
              fi
              deleted=$((deleted + 1)); deleted_bytes=$((deleted_bytes + size))
              printf '| #%s | %s | %s MB | %s |\n' "$number" "$id" "$((size / 1048576))" "$action" >> "$rows"
            done < "$list"
          done

          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Cache cleanup (dry run, nothing deleted)"
            else
              echo "## Cache cleanup"
            fi
            echo
            echo "Caches of closed pull requests: $deleted ($((deleted_bytes / 1048576)) MB)."
            echo "Pull requests still open, caches kept: $kept_open."
            echo "Errors: $failed."
            if [ -s "$rows" ]; then
              echo
              echo "| Pull request | Cache id | Size | Action |"
              echo "| --- | --- | --- | --- |"
              cat "$rows"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed lookups or deletions failed; see the warnings above."
            exit 1
          fi
