name: Markdown lint

# Lints the documentation (docs/, the READMEs and the changelog.d guide) with markdownlint-cli2 for
# structure: heading levels, blank lines around lists and headings, fenced code languages, empty links.
# Rules and the reason each disabled rule is off live in .markdownlint.jsonc. The tool and its
# dependencies are pinned by .github/markdownlint/package-lock.json (installed with npm ci).
on:
  pull_request:
    branches: [ main, next, 'release/**' ]
    paths:
      - 'docs/**'
      - 'README*.md'
      - 'packages/*/README.md'
      - 'changelog.d/README.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/markdownlint/**'
      - '.github/workflows/markdownlint.yml'
  push:
    branches: [ main, next ]
    paths:
      - 'docs/**'
      - 'README*.md'
      - 'packages/*/README.md'
      - 'changelog.d/README.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/markdownlint/**'
      - '.github/workflows/markdownlint.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it. Runs for main, release branches,
# the merge queue and the schedule always complete (each has its own group).
concurrency:
  group: markdownlint-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Install markdownlint-cli2 (locked)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/markdownlint
      - name: markdownlint
        run: .github/markdownlint/node_modules/.bin/markdownlint-cli2
