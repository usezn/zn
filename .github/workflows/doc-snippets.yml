name: Doc snippets

# Runs the code blocks of README.md, packages/*/README.md and docs/*.md that are marked with
# `<!-- snippet-test -->`, against the packages built from this commit: the zn-gate tarball from `npm pack`
# and the Python package installed from packages/zn-gate-py. Each block runs alone in a new directory, in an
# empty network namespace, with no API key in its environment. A block that shows an API that does not exist
# (or no longer works as written) fails the job with the file and line. How to mark a block:
# CONTRIBUTING.md, "Runnable doc snippets".
on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'packages/**'
      - '.github/scripts/doc-snippets*'
      - '.github/workflows/doc-snippets.yml'
  pull_request:
    branches: [ next, main, 'release/**' ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'packages/**'
      - '.github/scripts/doc-snippets*'
      - '.github/workflows/doc-snippets.yml'
  # Nightly run on next (a schedule runs on main; the checkout steps switch to next).
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it. Runs for main, release branches,
# the merge queue and the schedule always complete (each has its own group).
concurrency:
  group: doc-snippets-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  snippets:
    name: Doc snippets (node 22, python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.schedule == '20 3 * * *' && 'next' || '' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the markers
        run: python3 .github/scripts/doc-snippets.py list
      - name: Run the marked snippets offline
        run: python3 .github/scripts/doc-snippets.py run --netns
