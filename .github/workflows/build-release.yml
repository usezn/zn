# Reusable build of the release artifacts: resolves the tag commit, builds the npm and Python packages, then attests and signs them.
name: Build release

# Reusable workflow called only by release.yml: builds the npm tarball and the
# Python sdist and wheel once, then (after approval on the "release"
# environment, never in a dry run) attests and signs them. Building and
# attesting in a reusable workflow keeps those steps out of reach of the
# calling workflow, which makes the build provenance SLSA Build Level 3: the
# attestations name this file as their signer workflow.
#
# It also writes a CycloneDX SBOM for the npm package and one for the Python
# package, attests them (SBOM attestation) and attaches them to the release.
#
# How to verify a release: docs/verify-release.md

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build; its commit is resolved and checked here again"
        required: true
        type: string
      expected_sha:
        description: "Commit the caller verified for the tag: only compared, never checked out"
        required: true
        type: string
      npm_version:
        required: true
        type: string
      py_version:
        required: true
        type: string
      dry_run:
        description: "Build only: nothing is attested or signed"
        required: true
        type: boolean

permissions: {}

env:
  ARTIFACT_NAME: zn-gate-release
  # The same gitsign as release.yml, to check the tag signature here too.
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae

jobs:
  # This workflow does not take a commit from its caller: it finds the commit of the tag itself and checks
  # again that it is on main or a release/* branch. It also checks, itself, who called it and the tag: only release.yml,
  # for the tag of the push that started the run or as a dry run of a manual run, and only a tag signed by tag-release.yml.
  # Nothing from the repository is run here.
  resolve:
    name: Resolve the commit of the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: .github
          persist-credentials: false
      - name: Find the commit of the tag on main or a release branch
        id: sha
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' || { echo "::error::'$TAG' is not a release tag"; exit 1; }
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          # The tag must still point to the commit the caller verified (and whose tag signature it checked).
          [ "$sha" = "$EXPECTED_SHA" ] || { echo "::error::$TAG is now $sha, but the release verified $EXPECTED_SHA"; exit 1; }
          if git for-each-ref --contains "$sha" --format='%(refname:short)' refs/remotes/origin | grep -Eq '^origin/(main|release/.+)$'; then
            echo "$TAG is $sha, on main or a release branch"
          else
            echo "::error::$TAG ($sha) is not on main or a release/* branch"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check the caller, the event and the tag signature
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # In a reusable workflow GITHUB_WORKFLOW_REF names the calling workflow.
          case "$GITHUB_WORKFLOW_REF" in
            "$GITHUB_REPOSITORY/.github/workflows/release.yml@"*) ;;
            *) echo "::error::this workflow is only called by release.yml, not $GITHUB_WORKFLOW_REF"; exit 1 ;;
          esac
          if [ "$EVENT" = push ]; then
            # A tag push builds the pushed tag and nothing else.
            [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "::error::the run was started by $GITHUB_REF, not by the tag $TAG"; exit 1; }
          else
            # Any other event (a manual run) is a dry run: nothing is signed or published.
            [ "$DRY_RUN" = true ] || { echo "::error::a $EVENT run must be a dry run"; exit 1; }
          fi
          base="${TAG#v}"; base="${base%%-*}"
          if ! git cat-file -e "$SHA:.github/workflows/tag-release.yml" 2>/dev/null \
              && [ "$(printf '%s\n' 1.12.0 "$base" | sort -V | head -n 1)" != 1.12.0 ]; then
            echo "$TAG predates signed tags (before 1.12.0): its tag is not signed."
            exit 0
          fi
          # The annotated tag object, signed by tag-release.yml on main, still on the commit resolved above.
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || { echo "::error::$TAG is not an annotated, signed tag"; exit 1; }
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" ] || { echo "::error::$TAG no longer points to $SHA"; exit 1; }
          url="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitsign" "$url"
          echo "${GITSIGN_SHA256}  $RUNNER_TEMP/gitsign" | sha256sum --strict -c -
          chmod +x "$RUNNER_TEMP/gitsign"
          "$RUNNER_TEMP/gitsign" verify-tag "$TAG" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/tag-release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  # The static hook launcher (tools/hook-launcher) for Linux x64 and arm64 ships inside the npm package with its SHA-256
  # (lib/native/hook-launcher.json); the installer copies it only when the SHA-256 matches. It is compiled only for a tag
  # push, in a job of its own with no cache: it checks out the commit of the push event itself (the tag) and requires it to
  # be the commit the resolve job verified. A manual run (workflow_dispatch, a dry run of an existing tag) skips this job and
  # packs without the launcher; nothing from a manual run is signed or published. Standard library only, so no crate is
  # downloaded; aarch64 links with the rust-lld that ships with the toolchain.
  hook-launcher:
    name: Build the static hook launcher
    needs: resolve
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the commit the resolve job verified
        env:
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "::error::the run was started by $GITHUB_REF, not by the tag $TAG"; exit 1; }
          head="$(git rev-parse HEAD)"
          [ "$head" = "$RESOLVED_SHA" ] || { echo "::error::checked out $head, but the tag resolves to $RESOLVED_SHA"; exit 1; }
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Build the static hook launcher
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/hook-launcher"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build"
          for t in x86_64 aarch64; do
            cargo +1.99.0 build --locked --release --target "$t-unknown-linux-musl" --manifest-path tools/hook-launcher/Cargo.toml
          done
          N="$RUNNER_TEMP/native"
          mkdir -p "$N/linux-x64" "$N/linux-arm64"
          install -m 0755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/zn-hook-launcher" "$N/linux-x64/zn-hook-launcher"
          install -m 0755 "$CARGO_TARGET_DIR/aarch64-unknown-linux-musl/release/zn-hook-launcher" "$N/linux-arm64/zn-hook-launcher"
          X=$(sha256sum "$N/linux-x64/zn-hook-launcher" | cut -d' ' -f1)
          A=$(sha256sum "$N/linux-arm64/zn-hook-launcher" | cut -d' ' -f1)
          printf '{"linux-x64":"%s","linux-arm64":"%s"}\n' "$X" "$A" > "$N/hook-launcher.json"
          cat "$N/hook-launcher.json"
          # The x64 launcher must give its own fail-closed answer before it ships: no hook program, so exit 2.
          rc=0; "$N/linux-x64/zn-hook-launcher" zcode PreToolUse /nonexistent 2>/dev/null || rc=$?
          test "$rc" = 2
      - name: Upload the static hook launcher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-hook-launcher
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build npm tarball and Python distributions
    needs: [resolve, hook-launcher]
    # Runs after the launcher job, or without it in a manual dry run (where that job is skipped).
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.hook-launcher.result == 'success' || (github.event_name != 'push' && needs.hook-launcher.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      # Release tooling (tarball check, hash-pinned build tools) comes from the
      # commit that defines this workflow run. For a tag push it is the tagged
      # commit; for a dry run it is the dispatched branch.
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          # No Actions cache in a release build: nothing it builds can be read from or written to a cache.
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set a reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # The static hook launcher comes from the hook-launcher job (tag pushes only); a manual dry run packs without it.
      - name: Download the static hook launcher
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-hook-launcher
          path: packages/zn-gate/lib/native
      - name: Check the static hook launcher against its SHA-256 list
        if: github.event_name == 'push'
        working-directory: packages/zn-gate/lib/native
        run: |
          set -euo pipefail
          chmod 0755 linux-x64/zn-hook-launcher linux-arm64/zn-hook-launcher
          for k in linux-x64 linux-arm64; do
            want="$(jq -er --arg k "$k" '.[$k]' hook-launcher.json)"
            got="$(sha256sum "$k/zn-hook-launcher" | cut -d' ' -f1)"
            [ "$want" = "$got" ] || { echo "::error::$k launcher does not match hook-launcher.json"; exit 1; }
          done
      - name: Pack the npm tarball
        working-directory: packages/zn-gate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node "$GITHUB_WORKSPACE/.release-tools/.github/scripts/prune-bundled-sources.js" .
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/pack.json"
      - name: Check tarball contents
        run: node .release-tools/.github/scripts/check-npm-pack.js "$RUNNER_TEMP/pack.json" packages/zn-gate
      # A tag build must ship the launcher: both binaries and their list are in the tarball and match it.
      - name: Check the static hook launcher in the tarball
        if: github.event_name == 'push'
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          x="$RUNNER_TEMP/launcher-check"
          rm -rf "$x" && mkdir -p "$x"
          tar -xzf "$RUNNER_TEMP/release/zn-gate-${NPM_VERSION}.tgz" -C "$x" package/lib/native/hook-launcher.json \
            package/lib/native/linux-x64/zn-hook-launcher package/lib/native/linux-arm64/zn-hook-launcher
          for k in linux-x64 linux-arm64; do
            f="$x/package/lib/native/$k/zn-hook-launcher"
            [ -x "$f" ] || { echo "::error::$k launcher is not executable in the tarball"; exit 1; }
            want="$(jq -er --arg k "$k" '.[$k]' "$x/package/lib/native/hook-launcher.json")"
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$want" = "$got" ] || { echo "::error::$k launcher in the tarball does not match hook-launcher.json"; exit 1; }
          done
          rm -rf "$x"
      - name: Install hash-pinned Python build tools
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .release-tools/.github/pip-bootstrap-requirements.txt
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r .release-tools/.github/release-requirements.txt
      - name: Build the sdist and wheel
        run: |
          set -euo pipefail
          # --no-isolation: build with the hash-pinned setuptools from the
          # venv instead of resolving the build backend again from PyPI.
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation packages/zn-gate-py --outdir "$RUNNER_TEMP/release"
          # setuptools stamps the files it generates with the build time: fix the times, owners, order
          # and gzip header of the sdist, then build once more and require the same bytes.
          "$RUNNER_TEMP/build-venv/bin/python" -I .release-tools/.github/scripts/normalize-sdist.py "$RUNNER_TEMP"/release/*.tar.gz
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation packages/zn-gate-py --outdir "$RUNNER_TEMP/rebuild"
          "$RUNNER_TEMP/build-venv/bin/python" -I .release-tools/.github/scripts/normalize-sdist.py "$RUNNER_TEMP"/rebuild/*.tar.gz
          (cd "$RUNNER_TEMP/release" && sha256sum zn_gate-*) > "$RUNNER_TEMP/release.sum"
          (cd "$RUNNER_TEMP/rebuild" && sha256sum zn_gate-*) > "$RUNNER_TEMP/rebuild.sum"
          diff "$RUNNER_TEMP/release.sum" "$RUNNER_TEMP/rebuild.sum" || { echo "::error::the Python sdist or wheel differs between two builds of the same commit"; exit 1; }
          rm -rf "$RUNNER_TEMP/rebuild"
          "$RUNNER_TEMP/build-venv/bin/python" -m twine check --strict "$RUNNER_TEMP"/release/*.whl "$RUNNER_TEMP"/release/*.tar.gz
      - name: Check wheel and sdist contents
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/build-venv/bin/python" -I .release-tools/.github/scripts/check-python-pack.py "$RUNNER_TEMP"/release/*.whl "$RUNNER_TEMP"/release/*.tar.gz
      - name: Check file names and write SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
          PY_VERSION: ${{ inputs.py_version }}
        run: |
          set -euo pipefail
          expected="zn-gate-${NPM_VERSION}.tgz zn_gate-${PY_VERSION}.tar.gz zn_gate-${PY_VERSION}-py3-none-any.whl"
          for f in $expected; do
            [ -f "$f" ] || { echo "::error::missing $f"; ls -l; exit 1; }
          done
          count="$(find . -maxdepth 1 -type f | wc -l)"
          [ "$count" -eq 3 ] || { echo "::error::expected 3 files, found $count"; ls -l; exit 1; }
          # shellcheck disable=SC2086
          sha256sum $expected > SHA256SUMS
          cat SHA256SUMS
      - name: Upload unsigned build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-unsigned
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
      - name: Install the SBOM tools (hash-pinned)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .release-tools/.github/pip-bootstrap-requirements.txt
          "$RUNNER_TEMP/sbom-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r .release-tools/.github/sbom-requirements.txt
          # The npm tool comes from a committed lockfile with integrity hashes, and runs no install scripts.
          mkdir -p "$RUNNER_TEMP/sbom-npm"
          cp .release-tools/.github/sbom-tools/package.json .release-tools/.github/sbom-tools/package-lock.json "$RUNNER_TEMP/sbom-npm/"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/sbom-npm"
      - name: Write the CycloneDX SBOMs
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
          PY_VERSION: ${{ inputs.py_version }}
        run: |
          set -euo pipefail
          sbom="$RUNNER_TEMP/sbom"
          mkdir -p "$sbom"
          # npm package: what ships in the tarball (runtime dependencies from the lockfile, no dev tools).
          (cd packages/zn-gate && "$RUNNER_TEMP/sbom-npm/node_modules/.bin/cyclonedx-npm" \
            --omit dev --mc-type library --spec-version 1.6 --output-reproducible \
            --output-format JSON --output-file "$sbom/zn-gate-${NPM_VERSION}.cdx.json")
          # Python package: install the built wheel alone in an empty environment and list what is in it.
          python -m venv --without-pip "$RUNNER_TEMP/sbom-target"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip --python "$RUNNER_TEMP/sbom-target/bin/python" \
            install --disable-pip-version-check --no-cache-dir "$RUNNER_TEMP/release/zn_gate-${PY_VERSION}-py3-none-any.whl"
          "$RUNNER_TEMP/sbom-venv/bin/cyclonedx-py" environment "$RUNNER_TEMP/sbom-target" \
            --pyproject packages/zn-gate-py/pyproject.toml --mc-type library --sv 1.6 --of JSON \
            --output-reproducible -o "$sbom/zn_gate-${PY_VERSION}.cdx.json"
          # Reproducible CycloneDX output has no serialNumber, which GitHub attestations require:
          # add one derived from the package, version and artifact hash (same build, same SBOM).
          node .release-tools/.github/scripts/sbom-serial.js "$sbom/zn-gate-${NPM_VERSION}.cdx.json" "$RUNNER_TEMP/release/zn-gate-${NPM_VERSION}.tgz"
          node .release-tools/.github/scripts/sbom-serial.js "$sbom/zn_gate-${PY_VERSION}.cdx.json" "$RUNNER_TEMP/release/zn_gate-${PY_VERSION}-py3-none-any.whl"
          # Each SBOM must name the package and version it describes.
          node .release-tools/.github/scripts/check-sbom.js "$sbom/zn-gate-${NPM_VERSION}.cdx.json" "$NPM_VERSION"
          node .release-tools/.github/scripts/check-sbom.js "$sbom/zn_gate-${PY_VERSION}.cdx.json" "$PY_VERSION"
          ls -l "$sbom"
      - name: Upload unsigned SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-sbom-unsigned
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Attest and sign
    needs: build
    # Nothing is signed or attested before the maintainer approves the release
    # environment, and never in a dry run.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No network evidence yet for this job (it had no harden-runner): audit first; once a release run shows
      # its endpoints in the step-security insights, switch to egress-policy: block with allowed-endpoints.
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-unsigned
          path: release
      - name: Check SHA256SUMS
        working-directory: release
        run: sha256sum --strict -c SHA256SUMS
      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}-sbom-unsigned
          path: sbom
      - name: Move the SBOMs next to the release files
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
          PY_VERSION: ${{ inputs.py_version }}
        run: |
          set -euo pipefail
          [ "$(find sbom -type f | wc -l)" -eq 2 ] || { echo "::error::expected 2 SBOM files"; ls -l sbom; exit 1; }
          mv "sbom/zn-gate-${NPM_VERSION}.cdx.json" "sbom/zn_gate-${PY_VERSION}.cdx.json" release/
      - name: GitHub artifact attestations (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.whl
            release/*.tar.gz
            release/*.cdx.json
            release/SHA256SUMS
      - name: GitHub artifact attestation (SBOM of the npm package)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/zn-gate-${{ inputs.npm_version }}.tgz
          sbom-path: release/zn-gate-${{ inputs.npm_version }}.cdx.json
      - name: GitHub artifact attestation (SBOM of the Python package)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release/zn_gate-${{ inputs.py_version }}.tar.gz
            release/zn_gate-${{ inputs.py_version }}-py3-none-any.whl
          sbom-path: release/zn_gate-${{ inputs.py_version }}.cdx.json
      # In a called workflow the signing identity is this file at the ref of the
      # run (the tag), not the calling release.yml.
      - name: Sigstore signatures
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            release/*.tgz
            release/*.whl
            release/*.tar.gz
            release/*.cdx.json
            release/SHA256SUMS
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/build-release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - name: List signed files
        run: ls -l release
      - name: Upload signed release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release/
          if-no-files-found: error
          retention-days: 30
