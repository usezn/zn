name: Windows checks for Windows-specific code

# The Node.js unit test suite on Windows. ci.yml runs that suite on Ubuntu only, so this is the one
# workflow that runs it on Windows (Node.js 22):
# - on every push to main and to a release branch, so a release commit is never tagged without it
#   (.github/release-required-checks.txt names this job);
# - on pull requests into next, main and release branches that touch code with Windows-specific paths
#   (command quoting, launching programs, the keychain, the broker, agent setup) or any test;
# - in the merge queue.

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ next, main, 'release/**' ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'packages/zn-gate/lib/exe.js'
      - 'packages/zn-gate/lib/shell-quote.js'
      - 'packages/zn-gate/lib/hooks/**'
      - 'packages/zn-gate/lib/broker/**'
      - 'packages/zn-gate/lib/vault/**'
      - 'packages/zn-gate/lib/agents/**'
      - 'packages/zn-gate/lib/init.js'
      - 'packages/zn-gate/bin/**'
      - 'packages/zn-gate/test/**'
      - 'plugins/tools/**'
      - '.github/workflows/windows-paths.yml'
  # The merge queue always runs it: one Windows job on the LTS version is the Windows sample of the queue.
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

# A new push to a pull request or to a release branch cancels the run still going for the same pull request or
# branch (the last run is never cancelled). The push run is not skipped when a pull request has the commit: the
# pull request run only starts for some paths, so this one gives the required check. Runs for main and the merge
# queue always complete (each has its own group).
concurrency:
  group: windows-paths-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && (github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/heads/release/'))) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/heads/release/'))) }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  windows:
    name: Windows (Node.js 22)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Install zn-gate dependencies
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: zn-gate unit tests
        working-directory: packages/zn-gate
        run: npm test
      - name: Vault tests (Windows Credential Manager)
        working-directory: packages/zn-gate
        env:
          ZN_TEST_NATIVE_KEYCHAIN: '1'
        run: node test/vault.test.js
      - name: Plugin launcher tests
        run: node plugins/tools/test-launch.js
