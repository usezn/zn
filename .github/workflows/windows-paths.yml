name: Windows checks for Windows-specific code

# The Node.js unit test suite on Windows. ci.yml runs that suite on Ubuntu only, so this is the one
# workflow that runs it on Windows (Node.js 22):
# - on every push to main and to a release branch, so a release commit is never tagged without it
#   (.github/release-required-checks.txt names this job);
# - on pull requests into next, main and release branches that touch code with Windows-specific paths
#   (command quoting, launching programs, the keychain, the broker, agent setup) or any test;
# - in the merge queue.
#
# The tests of the hook launchers (shell scripts that Claude Code starts with Git Bash) run here too: the job links
# Git for Windows' usr/bin as C:\bin and puts it on the PATH, so /bin/sh and sh start. On a Windows machine
# without that layout the same tests are skipped (test/helpers/posix_sh.js).

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ next, main, 'release/**' ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'packages/zn-gate/lib/exe.js'
      - 'packages/zn-gate/lib/shell-quote.js'
      - 'packages/zn-gate/lib/hooks/**'
      - 'packages/zn-gate/lib/broker/**'
      - 'packages/zn-gate/lib/vault/**'
      - 'packages/zn-gate/lib/agents/**'
      - 'packages/zn-gate/lib/init.js'
      - 'packages/zn-gate/bin/**'
      - 'packages/zn-gate/test/**'
      - 'plugins/tools/**'
      - '.github/workflows/windows-paths.yml'
      - '.github/windows-skip-baseline.txt'
  workflow_dispatch:
  # The merge queue always runs it: one Windows job on the LTS version is the Windows sample of the queue.
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

concurrency:
  group: windows-paths-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  windows:
    name: Windows (Node.js 22)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Set up Git Bash for the launcher tests
        shell: pwsh
        run: |
          $git = 'C:\Program Files\Git'
          if (-not (Test-Path "$git\usr\bin\sh.exe")) { throw "Git for Windows is not at $git" }
          # A program started as /bin/sh is looked up in the root of the current drive, which is the drive of the workspace.
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          if (-not (Test-Path "$drive\bin")) {
            cmd /c mklink /D "$drive\bin" "$git\usr\bin"
            if ($LASTEXITCODE -ne 0) { throw "could not link $drive\bin" }
          }
          # Appended, not prepended: the Windows tools keep their place before the Git for Windows ones.
          "Path=$env:Path;$git\usr\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node -e "process.exit(require('child_process').spawnSync('/bin/sh', ['-c', 'exit 0']).status === 0 ? 0 : 1)"
          if ($LASTEXITCODE -ne 0) { throw "/bin/sh does not start from $drive" }
      - name: Check that sh starts from the PATH
        shell: pwsh
        run: |
          sh -c 'echo sh-ok'
          if ($LASTEXITCODE -ne 0) { throw 'sh is not on the PATH' }
      - name: Install zn-gate dependencies
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: zn-gate unit tests
        # PowerShell, so that the tests see the Windows tools (whoami, icacls) first. The output is also kept in a file
        # for the next step. The step fails on the exit code of npm test.
        working-directory: packages/zn-gate
        run: |
          npm test | Tee-Object -FilePath "$env:RUNNER_TEMP\unit.log"
          exit $LASTEXITCODE
      - name: Count the tests skipped on Windows
        # Counted from the node --test summaries and compared with .github/windows-skip-baseline.txt: a new skip fails
        # the job, fewer skips do not.
        shell: bash
        run: |
          log="$RUNNER_TEMP/unit.log"
          count=$(grep -a -E '^(#|ℹ) skipped [0-9]+' "$log" | awk '{ s += $3 } END { print s + 0 }')
          found=$(grep -a -c -E '^(#|ℹ) skipped [0-9]+' "$log" || true)
          base=$(grep -v '^#' .github/windows-skip-baseline.txt | tr -d '[:space:]')
          echo "Tests skipped on Windows: $count (baseline $base)"
          echo "Tests skipped on Windows: $count (baseline $base)" >> "$GITHUB_STEP_SUMMARY"
          case "$base" in ''|*[!0-9]*) echo 'The baseline in .github/windows-skip-baseline.txt is not a number.'; exit 1;; esac
          if [ "$found" = 0 ]; then echo 'No skipped-test summary found in the test output.'; exit 1; fi
          if [ "$count" -gt "$base" ]; then
            echo "More tests are skipped on Windows than the baseline allows ($count > $base). Run them, or skip them with a reason and raise the baseline in .github/windows-skip-baseline.txt."
            exit 1
          fi
      - name: Vault tests (Windows Credential Manager)
        working-directory: packages/zn-gate
        env:
          ZN_TEST_NATIVE_KEYCHAIN: '1'
        run: node test/vault.test.js
      - name: Plugin launcher tests
        run: node plugins/tools/test-launch.js
