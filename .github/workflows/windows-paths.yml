# Windows tests of the zn-gate code paths that are Windows-specific, on pushes to main and release branches and on pull requests that touch them.
name: Windows checks for Windows-specific code

# The Node.js unit test suite on Windows. ci.yml runs that suite on Ubuntu only, so this is the one
# workflow that runs it on Windows (Node.js 22):
# - on every push to main and to a release branch, so a release commit is never tagged without it
#   (.github/release-required-checks.txt names this job);
# - on pull requests into main and release branches that touch code with Windows-specific paths
#   (command quoting, launching programs, the keychain, the broker, agent setup). A pull request that changes
#   only tests does not run it; the push to main and the nightly run on next cover those;
# - every night on next (nightly-next.yml starts a manual run there), and on other manual runs.
# The merge queue runs only the required checks, so it does not run this workflow.
#
# Pull requests into next do not run it. The Windows checks run on pull requests into main and release branches
# and every night on next, which keeps the cost of a Windows runner off the pull requests that merge most often.
# To run it on pull requests into next again, add `next` to the branches list of pull_request below.
#
# The tests of the hook launchers (shell scripts that Claude Code starts with Git Bash) run here too: the job links
# Git for Windows' usr/bin as C:\bin and puts it on the PATH, so /bin/sh and sh start. On a Windows machine
# without that layout the same tests are skipped (test/helpers/posix_sh.js).

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'packages/zn-gate/lib/exe.js'
      - 'packages/zn-gate/lib/shell-quote.js'
      - 'packages/zn-gate/lib/hooks/**'
      - 'packages/zn-gate/lib/broker/**'
      - 'packages/zn-gate/lib/vault/**'
      - 'packages/zn-gate/lib/agents/**'
      - 'packages/zn-gate/lib/init.js'
      - 'packages/zn-gate/bin/**'
      - 'plugins/tools/**'
      - 'plugins/zcode/scripts/**'
      - 'plugins/zn-gate/scripts/**'
      - '.github/workflows/windows-paths.yml'
      - '.github/windows-skip-baseline.txt'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for it. Other runs always complete (each has its own
# group).
concurrency:
  group: windows-paths-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  windows:
    name: Windows (Node.js 22)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      # actions: read lets the skipped-tests step download the list of the last successful run.
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Set up Git Bash for the launcher tests
        shell: pwsh
        run: |
          $git = 'C:\Program Files\Git'
          if (-not (Test-Path "$git\usr\bin\sh.exe")) { throw "Git for Windows is not at $git" }
          # A program started as /bin/sh is looked up in the root of a drive: the tests start it from the workspace (this
          # drive) and from temporary folders (the temp drive), and the lookup follows the working directory of the new
          # process. So the link goes on each of those drives, and on C:.
          $drives = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, 'C:\') | Where-Object { $_ } | ForEach-Object { Split-Path -Qualifier $_ } | Sort-Object -Unique
          foreach ($drive in $drives) {
            if (-not (Test-Path "$drive\bin")) {
              cmd /c mklink /D "$drive\bin" "$git\usr\bin"
              if ($LASTEXITCODE -ne 0) { throw "could not link $drive\bin" }
            }
          }
          # Appended, not prepended: the Windows tools keep their place before the Git for Windows ones.
          "Path=$env:Path;$git\usr\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node -e "const cp = require('child_process'); const ok = (cwd) => cp.spawnSync('/bin/sh', ['-c', 'exit 0'], { cwd }).status === 0; process.exit(ok(process.cwd()) && ok(require('os').tmpdir()) ? 0 : 1)"
          if ($LASTEXITCODE -ne 0) { throw "/bin/sh does not start from the workspace or the temp folder" }
      - name: Check that the launcher tests will run
        # Fails when no POSIX sh starts, so the launcher tests cannot be skipped without anyone noticing.
        working-directory: packages/zn-gate
        run: |
          sh -c 'echo sh-ok'
          if ($LASTEXITCODE -ne 0) { throw 'sh is not on the PATH' }
          node -e "process.exit(require('./test/helpers/posix_sh.js').hasPosixSh ? 0 : 1)"
          if ($LASTEXITCODE -ne 0) { throw 'hasPosixSh is false: the launcher tests would be skipped' }
      - name: Install zn-gate dependencies
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: zn-gate unit tests
        # PowerShell, so that the tests see the Windows tools (whoami, icacls) first. The output is also kept in a file
        # for the next step. The step fails on the exit code of npm test.
        working-directory: packages/zn-gate
        run: |
          npm test | Tee-Object -FilePath "$env:RUNNER_TEMP\unit.log"
          exit $LASTEXITCODE
      - name: Count the tests skipped on Windows
        # Counted from the node --test summaries and compared with .github/windows-skip-baseline.txt: a new skip fails
        # the job, fewer skips do not.
        shell: bash
        run: |
          log="$RUNNER_TEMP/unit.log"
          count=$(grep -a -E '^(#|ℹ) skipped [0-9]+' "$log" | awk '{ s += $3 } END { print s + 0 }')
          found=$(grep -a -c -E '^(#|ℹ) skipped [0-9]+' "$log" || true)
          base=$(grep -v '^#' .github/windows-skip-baseline.txt | tr -d '[:space:]')
          echo "Tests skipped on Windows: $count (baseline $base)"
          echo "Tests skipped on Windows: $count (baseline $base)" >> "$GITHUB_STEP_SUMMARY"
          case "$base" in ''|*[!0-9]*) echo 'The baseline in .github/windows-skip-baseline.txt is not a number.'; exit 1;; esac
          if [ "$found" = 0 ]; then echo 'No skipped-test summary found in the test output.'; exit 1; fi
          if [ "$count" -gt "$base" ]; then
            echo "More tests are skipped on Windows than the baseline allows ($count > $base). Run them, or skip them with a reason and raise the baseline in .github/windows-skip-baseline.txt."
            exit 1
          fi
      - name: List the skipped tests and compare with the last successful run
        # Writes the names of the skipped tests to the job summary and the difference from the list of the last
        # successful run (kept as the artifact windows-skipped-tests). It never fails the job: the step above decides that.
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/unit.log"
          dir="$RUNNER_TEMP/skipped"
          mkdir -p "$dir/prev"
          # One line per skipped test, as node --test prints it (TAP "ok N - name # SKIP reason" or the spec reporter).
          grep -a -i -E '# skip' "$log" | grep -a -v -E '^(#|ℹ) skipped' | sed -E 's/^[[:space:]]+//; s/\r$//; s/^ok [0-9]+ - //; s/ \([0-9.]+ms\)//' | sort > "$dir/skipped-tests.txt" || true
          now=$(wc -l < "$dir/skipped-tests.txt" | tr -d ' ')
          {
            echo "### Skipped tests on Windows ($now listed)"
            echo
            echo "The summary count above is the sum of the node --test summaries; this list is the lines marked as skipped in the output."
            echo
            echo '<details><summary>Skipped tests</summary>'
            echo
            echo '```'
            cat "$dir/skipped-tests.txt"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          have=0
          for id in $(gh run list --workflow windows-paths.yml --status success --limit 5 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name windows-skipped-tests --dir "$dir/prev" >/dev/null 2>&1 && [ -f "$dir/prev/skipped-tests.txt" ]; then
              have=1
              echo "Compared with run $id."
              prev_id="$id"
              break
            fi
          done
          {
            echo
            echo "### Difference from the last successful run"
            echo
            if [ "$have" = 0 ]; then
              echo "No list from a previous successful run is available (none yet, or its artifact expired)."
            else
              prev=$(wc -l < "$dir/prev/skipped-tests.txt" | tr -d ' ')
              echo "Previous successful run: ${prev_id} ($prev listed, now $now)."
              echo
              added=$(comm -13 "$dir/prev/skipped-tests.txt" "$dir/skipped-tests.txt")
              removed=$(comm -23 "$dir/prev/skipped-tests.txt" "$dir/skipped-tests.txt")
              echo "Newly skipped:"
              echo '```'
              if [ -n "$added" ]; then printf '%s\n' "$added"; else echo "(none)"; fi
              echo '```'
              echo "No longer skipped:"
              echo '```'
              if [ -n "$removed" ]; then printf '%s\n' "$removed"; else echo "(none)"; fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the list of skipped tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-skipped-tests
          path: ${{ runner.temp }}/skipped/skipped-tests.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Vault tests (Windows Credential Manager)
        working-directory: packages/zn-gate
        env:
          ZN_TEST_NATIVE_KEYCHAIN: '1'
        run: node test/vault.test.js
      # Also when a step above failed: the launcher tests are separate, and a failure there must not hide them.
      - name: Plugin launcher tests
        if: ${{ !cancelled() }}
        run: node plugins/tools/test-launch.js
