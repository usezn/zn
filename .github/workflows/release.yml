name: Release

# Builds the npm tarball and the Python sdist and wheel once, signs them, and
# publishes those exact files to PyPI (OIDC trusted publishing, no stored
# tokens), stages them on npm and creates a GitHub Release.
#
# npm: zn-gate is declared dual-use, and npm does not let a dual-use package be
# published directly with trusted publishing: the workflow stages the signed
# tarball (`npm stage publish`, OIDC, no stored token) and a maintainer approves
# the stage with 2FA, on npmjs.com (Staged Packages > Approve) or with
# `npm stage approve <stage-id>`. Nothing is public on npm until then. The npm
# job waits for the approval, so the GitHub Release is only created once the
# package is live. PyPI does not wait for npm.
#
# - Tag push (vX.Y.Z or vX.Y.Z-beta.N): verify, then build in the reusable
#   build-release.yml, then wait for approval on the "release" environment
#   before anything is signed, attested or published (signing, the two publish
#   jobs and the GitHub Release each ask for that approval).
# - workflow_dispatch: dry run for an existing tag. It verifies and builds,
#   uploads the unsigned workflow artifact and stops. It never signs or publishes.
#
# From 1.12.0 on (and for any commit that has tag-release.yml), a tag is
# released only with a valid signature from tag-release.yml, which creates,
# signs and pushes it; a tag pushed any other way is refused before anything
# is built.
#
# How to verify a release: docs/verify-release.md

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (dry run, nothing is signed or published), e.g. v1.5.0"
        required: true
        type: string

env:
  ARTIFACT_NAME: zn-gate-release
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, versions and branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      npm_version: ${{ steps.meta.outputs.npm_version }}
      py_version: ${{ steps.meta.outputs.py_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check the tag name
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check versions and the branch of the tagged commit
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          npm_version="$(node -p "require('./packages/zn-gate/package.json').version")"
          py_version="$(python3 -c "import tomllib; print(tomllib.load(open('packages/zn-gate-py/pyproject.toml','rb'))['project']['version'])")"
          py_init_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' packages/zn-gate-py/src/zn_gate/__init__.py)"

          # npm 1.5.0-beta.2 <-> PyPI 1.5.0b2 (alpha -> a, rc -> rc)
          base="${tag_version%%-*}"
          prerelease=false
          expected_py="$base"
          if [ "$tag_version" != "$base" ]; then
            prerelease=true
            pre="${tag_version#*-}"
            kind="${pre%%.*}"
            num="${pre#*.}"
            case "$kind" in
              alpha) expected_py="${base}a${num}" ;;
              beta) expected_py="${base}b${num}" ;;
              rc) expected_py="${base}rc${num}" ;;
            esac
          fi

          fail=0
          if [ "$npm_version" != "$tag_version" ]; then
            echo "::error::packages/zn-gate/package.json has $npm_version, tag expects $tag_version"; fail=1
          fi
          if [ "$py_version" != "$expected_py" ]; then
            echo "::error::packages/zn-gate-py/pyproject.toml has $py_version, tag expects $expected_py"; fail=1
          fi
          if [ "$py_init_version" != "$expected_py" ]; then
            echo "::error::zn_gate/__init__.py has $py_init_version, tag expects $expected_py"; fail=1
          fi
          # MCP Registry metadata: both versions in server.json must match the npm version.
          if [ -f packages/zn-gate/server.json ]; then
            sj_versions="$(node -p "const d=require('./packages/zn-gate/server.json'); [d.version, ...(d.packages||[]).filter(p=>p.identifier==='zn-gate').map(p=>p.version)].join(' ')")"
            for v in $sj_versions; do
              if [ "$v" != "$tag_version" ]; then
                echo "::error::packages/zn-gate/server.json has version $v, tag expects $tag_version"; fail=1
              fi
            done
          fi

          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          if git for-each-ref --contains "$sha" --format='%(refname:short)' refs/remotes/origin \
              | grep -Eq '^origin/(main|release/.+)$'; then
            echo "Tagged commit $sha is on main or a release/* branch"
          else
            echo "::error::Tagged commit $sha is not on main or a release/* branch"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          {
            echo "tag=$TAG"
            echo "sha=$sha"
            echo "npm_version=$npm_version"
            echo "py_version=$py_version"
            echo "prerelease=$prerelease"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG sha=$sha npm=$npm_version pypi=$py_version prerelease=$prerelease dry_run=$DRY_RUN"
      # From 1.12.0 on, and for any commit that has tag-release.yml, a release comes only from a tag that
      # workflow signed: a tag pushed by hand, or by anyone else, is refused before anything is built.
      # The version rule holds even for a release commit from which tag-release.yml was removed.
      - name: Check the tag signature
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          base="${TAG#v}"; base="${base%%-*}"
          if ! git cat-file -e "$SHA:.github/workflows/tag-release.yml" 2>/dev/null \
              && [ "$(printf '%s\n' 1.12.0 "$base" | sort -V | head -n 1)" != 1.12.0 ]; then
            echo "$TAG predates signed tags (before 1.12.0): its tag is not signed."
            exit 0
          fi
          # The annotated tag object itself, as it is on GitHub, and still on the verified commit.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || { echo "::error::$TAG is not an annotated, signed tag"; exit 1; }
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" ] || { echo "::error::$TAG no longer points to $SHA"; exit 1; }
          url="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitsign" "$url"
          echo "${GITSIGN_SHA256}  $RUNNER_TEMP/gitsign" | sha256sum --strict -c -
          chmod +x "$RUNNER_TEMP/gitsign"
          "$RUNNER_TEMP/gitsign" verify-tag "$TAG" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/tag-release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  # Build, attestations and signatures run in a reusable workflow, out of reach
  # of this one (SLSA Build Level 3). Its signing job waits for approval on the
  # "release" environment and is skipped in a dry run.
  build:
    name: Build, attest and sign
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
      expected_sha: ${{ needs.verify.outputs.sha }}
      npm_version: ${{ needs.verify.outputs.npm_version }}
      py_version: ${{ needs.verify.outputs.py_version }}
      dry_run: ${{ needs.verify.outputs.dry_run == 'true' }}

  publish-pypi:
    name: Publish to PyPI
    needs: [verify, build]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/zn-gate/${{ needs.verify.outputs.py_version }}/
    permissions:
      id-token: write
    steps:
      # No network evidence yet for this job (it had no harden-runner): audit first; once a release run shows
      # its endpoints in the step-security insights, switch to egress-policy: block with allowed-endpoints.
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Download the signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release
      - name: Check SHA256SUMS and keep only the Python distributions
        env:
          PY_VERSION: ${{ needs.verify.outputs.py_version }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --strict -c SHA256SUMS)
          mkdir dist
          cp "release/zn_gate-${PY_VERSION}.tar.gz" "release/zn_gate-${PY_VERSION}-py3-none-any.whl" dist/
          ls -l dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-npm:
    name: Publish to npm
    needs: [verify, build]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    # Staging takes a few minutes; the rest is the wait for the maintainer's 2FA approval on npm.
    # Keep this above APPROVAL_WAIT_MINUTES plus about 10 minutes.
    timeout-minutes: 150
    env:
      # How long the job waits for a maintainer to approve the staged package on npm.
      APPROVAL_WAIT_MINUTES: "120"
    # One npm publication at a time across all versions (the workflow-level group is per tag): two
    # releases cannot read the dist-tags, publish and move "latest" at the same time. A run that waits
    # here keeps its place; GitHub keeps only one waiting run per group, so a third queued release would
    # replace the second: start them one after the other.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    environment:
      name: release
      url: https://www.npmjs.com/package/zn-gate/v/${{ needs.verify.outputs.npm_version }}
    permissions:
      contents: read # the checkout of the dist-tag script
      id-token: write
    steps:
      # No network evidence yet for this job (it had no harden-runner): audit first; once a release run shows
      # its endpoints in the step-security insights, switch to egress-policy: block with allowed-endpoints.
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # Only the dist-tag script, from the commit being released (the code that is published anyway).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: plan
          sparse-checkout: .github/scripts/npm-dist-tag-plan.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release
      - name: Check SHA256SUMS
        working-directory: release
        run: sha256sum --strict -c SHA256SUMS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false
      # Only the lockfile of the npm CLI is taken from the verified commit (no other file, no credentials).
      # It goes to its own folder: a checkout into the workspace root would delete the downloaded release/ folder.
      - name: Fetch the lockfile of the pinned npm CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: npm-cli
          sparse-checkout: .github/npm-cli
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # `npm stage publish` needs npm >= 11.15.0 and Node.js >= 22.14.0 (11.21.0 is the pinned version);
      # the runner's bundled npm floats with the Node.js release, so the release uses one exact CLI.
      # It comes from a committed lockfile (sha512 integrity of the tarball), is installed with
      # --ignore-scripts, and the integrity is compared again with the value pinned here before the CLI
      # is put on PATH.
      - name: Install the pinned npm CLI (integrity checked, no install scripts)
        env:
          NPM_CLI_VERSION: 11.21.0
          NPM_CLI_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: |
          set -euo pipefail
          cd npm-cli/.github/npm-cli
          locked="$(node -p "const e=require('./package-lock.json').packages['node_modules/npm']; e.version+' '+e.integrity")"
          if [ "$locked" != "${NPM_CLI_VERSION} ${NPM_CLI_INTEGRITY}" ]; then
            echo "::error::package-lock.json pins '$locked', the workflow expects '${NPM_CLI_VERSION} ${NPM_CLI_INTEGRITY}'"
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          installed="$(node -p "require('./node_modules/npm/package.json').version")"
          [ "$installed" = "$NPM_CLI_VERSION" ] || { echo "::error::installed npm $installed, expected $NPM_CLI_VERSION"; exit 1; }
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Show the npm CLI in use
        run: |
          set -euo pipefail
          [ "$(npm --version)" = 11.21.0 ] || { echo "::error::npm on PATH is not the pinned 11.21.0"; exit 1; }
          node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 22 || (a === 22 && b >= 14) ? 0 : 1)' \
            || { echo "::error::Node.js $(node --version) is older than 22.14, which npm stage needs"; exit 1; }
          echo "node $(node --version), npm $(npm --version)"
      # A re-run after the stage was approved late (the wait below timed out, the maintainer approved the
      # stage anyway) finds the version already on npm: it does not stage again; it checks that what is live
      # is this tarball and that the dist-tags are as planned when it was staged.
      - name: Check whether this version is already on npm
        id: live
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
        run: |
          set -euo pipefail
          if [ "$(npm view "zn-gate@${NPM_VERSION}" version --prefer-online 2>/dev/null || true)" = "$NPM_VERSION" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already on npm::zn-gate $NPM_VERSION is already on npm, so it is not staged again."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
      # Reads the dist-tags again here, after any wait for approval or for another release to finish
      # publishing, and fails closed (nothing is published) when they cannot be read or the release is
      # not newer than what its dist-tag points to. The rules are in .github/scripts/npm-dist-tag-plan.mjs
      # (tested by npm-dist-tag-plan.test.mjs):
      #   final        -> latest, only if newer than the current latest; otherwise release-X.Y,
      #                   so latest never moves back
      #   X.Y.Z-rc.N   -> next, X.Y.Z-beta.N -> beta, X.Y.Z-alpha.N -> alpha (only if newer than the tag)
      - name: Choose the dist-tag
        id: disttag
        if: steps.live.outputs.live != 'true'
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          if ! npm view zn-gate dist-tags --json --prefer-online > "$RUNNER_TEMP/dist-tags-before.json"; then
            echo "::error::Could not read the current dist-tags of zn-gate"
            exit 1
          fi
          cat "$RUNNER_TEMP/dist-tags-before.json"
          mkdir -p "$RUNNER_TEMP/dist-tag-plan"
          node plan/.github/scripts/npm-dist-tag-plan.mjs plan "$NPM_VERSION" "$RUNNER_TEMP/dist-tags-before.json" \
            "$RUNNER_TEMP/dist-tag-plan/npm-dist-tag-plan.json" "$RELEASE_SHA" | tee -a "$GITHUB_OUTPUT"
      # The plan is kept with the run before staging: a re-run of this job after a late approval finds the
      # version already on npm and checks the dist-tags against this plan (it cannot plan again, the tags
      # have moved by then). A re-run that stages again replaces it.
      - name: Keep the dist-tag plan with the stage
        if: steps.live.outputs.live != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist-tag-plan
          path: ${{ runner.temp }}/dist-tag-plan/npm-dist-tag-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      # Stages the tarball; it is not public until a maintainer approves it with 2FA. The dist-tag chosen
      # above is stored with the stage and applied when it is approved.
      - name: Stage the tarball with npm trusted publishing
        if: steps.live.outputs.live != 'true'
        working-directory: release
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          set -euo pipefail
          # Right before staging: the tarball must still be the file SHA256SUMS lists.
          tarball="zn-gate-${NPM_VERSION}.tgz"
          [ -f SHA256SUMS ] || { echo "::error::SHA256SUMS is missing"; exit 1; }
          [ -f "$tarball" ] || { echo "::error::$tarball is missing"; exit 1; }
          expected="$(awk -v f="$tarball" '$2 == f || $2 == "*" f { print $1 }' SHA256SUMS)"
          if [ -z "$expected" ] || [ "$(printf '%s\n' "$expected" | wc -l)" -ne 1 ]; then
            echo "::error::SHA256SUMS has no single entry for $tarball"; exit 1
          fi
          actual="$(sha256sum "$tarball" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::$tarball sha256 is $actual, SHA256SUMS lists $expected"; exit 1
          fi
          npm stage publish "./$tarball" --tag "$DIST_TAG" --access public --provenance --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/stage-output.txt"
      - name: Show how to approve the staged package
        if: steps.live.outputs.live != 'true'
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### zn-gate $NPM_VERSION is staged on npm and is not public yet"
            echo
            echo "A maintainer has to approve it with 2FA. This job waits for up to $APPROVAL_WAIT_MINUTES minutes."
            echo
            echo "1. npmjs.com > zn-gate > Staged Packages > Approve, or"
            echo "2. \`npm stage approve <stage-id>\` (\`npm stage list zn-gate\` shows the stage id; it may also be in the log of the staging step)."
            echo
            echo "It will be published under the \`$DIST_TAG\` dist-tag. To refuse it: \`npm stage reject <stage-id>\`."
            echo
            echo "Output of \`npm stage publish\` (lines about the stage and the provenance):"
            echo
            echo '```'
            grep -iE 'stag|provenance|sigstore|rekor|transparency' "$RUNNER_TEMP/stage-output.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=npm approval needed::zn-gate $NPM_VERSION is staged. Approve it with 2FA on npmjs.com (Staged Packages) or with npm stage approve <stage-id>."
      # Polls npm once a minute until the version is public, keeping this job (and the npm-publish
      # concurrency group) busy so that the GitHub Release is only created after the package is live and
      # no other release is staged meanwhile. When it is public, what is live must be exactly this tarball
      # (the registry integrity is compared with the sha512 of the verified file), not another stage.
      - name: Wait for the approval on npm
        working-directory: release
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
        run: |
          set -euo pipefail
          tarball="zn-gate-${NPM_VERSION}.tgz"
          want="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          deadline=$((SECONDS + APPROVAL_WAIT_MINUTES * 60))
          until [ "$(npm view "zn-gate@${NPM_VERSION}" version --prefer-online 2>/dev/null || true)" = "$NPM_VERSION" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::zn-gate $NPM_VERSION was not approved on npm within $APPROVAL_WAIT_MINUTES minutes. The stage may still be pending: approve it on npmjs.com (Staged Packages) or with npm stage approve <stage-id>, then re-run the failed jobs of this run (an already approved version is not staged again), or reject it with npm stage reject <stage-id>."
              exit 1
            fi
            echo "$((SECONDS / 60)) min: zn-gate $NPM_VERSION is not public yet, waiting for the approval on npm"
            sleep 60
          done
          got=""
          for attempt in 1 2 3 4 5 6; do
            got="$(npm view "zn-gate@${NPM_VERSION}" dist.integrity --prefer-online 2>/dev/null || true)"
            [ -n "$got" ] && break
            sleep 10
          done
          if [ "$got" != "$want" ]; then
            echo "::error::zn-gate $NPM_VERSION is on npm with integrity '${got}', but the verified tarball has '${want}'"
            exit 1
          fi
          echo "zn-gate $NPM_VERSION is on npm and is the verified tarball ($want)"
      # npm can take a few seconds to show a new dist-tag: read again for up to a minute. A dist-tag that
      # is not as planned, or a latest that moved backward, fails the job (the version is already published,
      # so this is a loud alarm for the maintainer to fix the dist-tag by hand, not a rollback).
      - name: Check the dist-tags after publishing
        if: steps.live.outputs.live != 'true'
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
          LATEST_BEFORE: ${{ steps.disttag.outputs.latest_before }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if npm view zn-gate dist-tags --json --prefer-online > "$RUNNER_TEMP/dist-tags-after.json" \
              && npm view zn-gate versions --json --prefer-online > "$RUNNER_TEMP/versions-after.json" \
              && node plan/.github/scripts/npm-dist-tag-plan.mjs verify "$NPM_VERSION" "$DIST_TAG" "$LATEST_BEFORE" \
                "$RUNNER_TEMP/dist-tags-after.json" "$RUNNER_TEMP/versions-after.json"; then
              exit 0
            fi
            echo "attempt $attempt: the dist-tags are not as expected yet"
            sleep 10
          done
          cat "$RUNNER_TEMP/dist-tags-after.json" || true
          echo "::error::zn-gate $NPM_VERSION was published, but its dist-tags are not as planned (dist-tag $DIST_TAG; latest before: ${LATEST_BEFORE:-none}; latest must not be older than the newest final on npm)"
          exit 1
      # Version already on npm (a re-run after a late approval): the plan saved when this run staged the
      # package (same version and commit) is checked, exactly like the normal path, together with the
      # tarball integrity checked above. Without that plan (lost, or this run never staged) the job fails,
      # so no GitHub Release is created until a maintainer reconciles by hand.
      - name: Fetch the dist-tag plan made when the package was staged
        id: staged-plan
        if: steps.live.outputs.live == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist-tag-plan
          path: ${{ runner.temp }}/staged-plan
      - name: Check the dist-tags against the staged plan (version already on npm)
        if: steps.live.outputs.live == 'true'
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
          PLAN_FETCH: ${{ steps.staged-plan.outcome }}
        run: |
          set -euo pipefail
          reconcile="Reconcile by hand: npm view zn-gate dist-tags; point the dist-tag at ${NPM_VERSION} with npm dist-tag add zn-gate@${NPM_VERSION} <tag> (latest must never move back); then create the GitHub Release by hand from the signed files of this run."
          plan="$RUNNER_TEMP/staged-plan/npm-dist-tag-plan.json"
          if [ "$PLAN_FETCH" != success ] || [ ! -s "$plan" ]; then
            echo "::error::zn-gate $NPM_VERSION is already on npm, but this run has no dist-tag plan from staging it (published outside this run, or the plan was lost). $reconcile"
            exit 1
          fi
          if ! node plan/.github/scripts/npm-dist-tag-plan.mjs staged "$NPM_VERSION" "$plan" "$RELEASE_SHA" > "$RUNNER_TEMP/staged-plan.txt"; then
            echo "::error::The saved dist-tag plan cannot be trusted for zn-gate $NPM_VERSION. $reconcile"
            exit 1
          fi
          DIST_TAG="$(sed -n 's/^tag=//p' "$RUNNER_TEMP/staged-plan.txt")"
          LATEST_BEFORE="$(sed -n 's/^latest_before=//p' "$RUNNER_TEMP/staged-plan.txt")"
          for attempt in 1 2 3 4 5 6; do
            if npm view zn-gate dist-tags --json --prefer-online > "$RUNNER_TEMP/dist-tags-after.json" \
              && npm view zn-gate versions --json --prefer-online > "$RUNNER_TEMP/versions-after.json" \
              && node plan/.github/scripts/npm-dist-tag-plan.mjs verify "$NPM_VERSION" "$DIST_TAG" "$LATEST_BEFORE" \
                "$RUNNER_TEMP/dist-tags-after.json" "$RUNNER_TEMP/versions-after.json"; then
              exit 0
            fi
            echo "attempt $attempt: the dist-tags are not as expected yet"
            sleep 10
          done
          cat "$RUNNER_TEMP/dist-tags-after.json" || true
          echo "::error::zn-gate $NPM_VERSION is on npm, but its dist-tags are not as planned when it was staged (dist-tag $DIST_TAG; latest before: ${LATEST_BEFORE:-none}). $reconcile"
          exit 1

  github-release:
    name: Create the GitHub Release
    needs: [verify, publish-pypi, publish-npm]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
    steps:
      # No network evidence yet for this job (it had no harden-runner): audit first; once a release run shows
      # its endpoints in the step-security insights, switch to egress-policy: block with allowed-endpoints.
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Download the signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release
      - name: Check SHA256SUMS
        working-directory: release
        run: sha256sum --strict -c SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v v="$NPM_VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No section for $NPM_VERSION in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "How to verify these files: [docs/verify-release.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/verify-release.md)"
          } >> "$RUNNER_TEMP/notes.md"
      - name: Check that the tag still points to the verified commit
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          # Annotated tags list the commit as "<tag>^{}"; lightweight tags list it directly.
          remote_sha="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
          fi
          if [ "$remote_sha" != "$VERIFIED_SHA" ]; then
            echo "::error::Tag $TAG points to '${remote_sha}', but this run verified and built $VERIFIED_SHA"
            exit 1
          fi
          echo "Tag $TAG still points to $VERIFIED_SHA"
      - name: Create the release (draft for final versions)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            mode=(--prerelease)
          else
            mode=(--draft)
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "zn-gate $NPM_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${mode[@]}"
