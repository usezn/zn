name: zn-gate Node.js on macOS

# Runs the whole zn-gate Node.js test suite on macOS with Node.js 22, including the vault tests against
# the native macOS Keychain. Pull requests do not run it: macOS runners are the scarcest ones and kept every
# pull request waiting. It runs in the merge queue (so not again on the push to next), on pushes to main and release branches that change
# code with macOS-specific behaviour (the paths below: Keychain, hooks, agent setup, launching programs, file
# system scans and links, the CLI), every day and on manual runs.
on:
  push:
    branches: [ main, 'release/**' ]
    paths:
      - 'packages/zn-gate/lib/vault/**'
      - 'packages/zn-gate/lib/hooks/**'
      - 'packages/zn-gate/lib/agents/**'
      - 'packages/zn-gate/lib/broker/**'
      - 'packages/zn-gate/lib/team/**'
      - 'packages/zn-gate/lib/audit/**'
      - 'packages/zn-gate/lib/reach/**'
      - 'packages/zn-gate/lib/scrub/**'
      - 'packages/zn-gate/lib/check.js'
      - 'packages/zn-gate/lib/client.js'
      - 'packages/zn-gate/lib/cloud-key.js'
      - 'packages/zn-gate/lib/connect-cli.js'
      - 'packages/zn-gate/lib/errors.js'
      - 'packages/zn-gate/lib/exe.js'
      - 'packages/zn-gate/lib/init.js'
      - 'packages/zn-gate/lib/init-guide.js'
      - 'packages/zn-gate/lib/mcp-secrets.js'
      - 'packages/zn-gate/lib/shell-quote.js'
      - 'packages/zn-gate/lib/stats-share.js'
      - 'packages/zn-gate/bin/**'
      - 'packages/zn-gate/test/**/*keychain*'
      - 'packages/zn-gate/test/**/*vault*'
      - 'packages/zn-gate/test/**/*scan*'
      - 'packages/zn-gate/package.json'
      - 'packages/zn-gate/package-lock.json'
      - '.github/workflows/node-macos.yml'
  # The merge queue always runs it (Node.js 22 on macOS is the macOS sample of the queue).
  merge_group:
    types: [ checks_requested ]
  # Daily full run on the default branch.
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to next cancels the run still going for it. Other runs always complete.
concurrency:
  group: node-macos-${{ (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  test-node-macos:
    name: Node.js 22 tests (macOS)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # step-security/harden-runner does not support macOS runners, so this job has no hardening step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No npm cache: this workflow runs on release branches, and a cache restored there could be poisoned by an
          # earlier run (zizmor cache-poisoning). The install is small.
          package-manager-cache: false
      - name: Install zn-gate dependencies
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Create a temporary keychain
        # A throwaway keychain with a random password, made the default for this job. The login
        # keychain is never used. It is deleted in the last step, even if the tests fail.
        run: |
          kc="$RUNNER_TEMP/zn-ci.keychain-db"
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
          echo "ZN_CI_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Run zn-gate tests (native Keychain backend)
        working-directory: packages/zn-gate
        env:
          ZN_TEST_NATIVE_KEYCHAIN: '1'
          ZN_KEYCHAIN_PATH: ${{ runner.temp }}/zn-ci.keychain-db
        run: npm test
      - name: Delete the temporary keychain
        if: always()
        run: |
          if [ -n "$ZN_CI_KEYCHAIN" ]; then
            security delete-keychain "$ZN_CI_KEYCHAIN" || true
          fi
