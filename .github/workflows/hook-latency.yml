name: Hook latency

# How long an agent waits for zn's hook on each tool call, by agent, event and output size
# (bench/hook_latency_matrix.js), with a budget against bench/hook_latency_baseline.json: a case whose p95,
# relative to Node's own start-up in the same run, is more than 20 % above its baseline fails, and so does a
# run whose median over all cases is more than 10 % above it. The Windows job has its own baseline and a 35 %
# per-case margin, and does not block a merge. Runs when the hook code or the benchmark changes. The report
# is kept as an artifact for 30 days.
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/zn-gate/lib/**'
      - 'packages/zn-gate/bin/**'
      - 'packages/zn-gate/package.json'
      - 'packages/zn-gate/package-lock.json'
      - 'packages/zn-gate/test/fixtures/fake_secrets*'
      - 'bench/hook_latency*'
      - '.github/workflows/hook-latency.yml'
  pull_request:
    branches: [ next, main, 'release/**' ]
    # ready_for_review: a draft that is marked ready runs the budget without another push.
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'packages/zn-gate/lib/**'
      - 'packages/zn-gate/bin/**'
      - 'packages/zn-gate/package.json'
      - 'packages/zn-gate/package-lock.json'
      - 'packages/zn-gate/test/fixtures/fake_secrets*'
      - 'bench/hook_latency*'
      - '.github/workflows/hook-latency.yml'
  # Nightly run on next (a schedule runs on main; the checkout steps switch to next).
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for it. Runs for main, the schedule and manual runs
# always complete (each has its own group).
concurrency:
  group: hook-latency-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  latency:
    name: Hook latency budget
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.schedule == '25 3 * * *' && 'next' || '' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Install
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Budget check tests
        run: node --test bench/hook_latency_gate.test.js
      - name: Measure and check the budget
        run: |
          set -euo pipefail
          args=(--runs 40 --json "$RUNNER_TEMP/hook_latency.json")
          # Without the baseline there is no budget to check, so the run fails instead of only reporting.
          if [ ! -f bench/hook_latency_baseline.json ]; then echo "::error::bench/hook_latency_baseline.json is missing; restore it or create it with --update-baseline"; exit 1; fi
          args+=(--baseline bench/hook_latency_baseline.json)
          node bench/hook_latency_matrix.js "${args[@]}" | tee "$RUNNER_TEMP/hook_latency.md"
      - name: Summary
        if: always()
        run: 'if [ -f "$RUNNER_TEMP/hook_latency.md" ]; then cat "$RUNNER_TEMP/hook_latency.md" >> "$GITHUB_STEP_SUMMARY" || true; fi'
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-latency
          path: ${{ runner.temp }}/hook_latency.json
          if-no-files-found: ignore
          retention-days: 30

  # Windows starts processes more slowly than Linux, so it has its own baseline and is checked apart.
  # Not a required check: the job is allowed to fail and only reports. The baseline is made of numbers
  # measured on a Windows runner.
  latency-windows:
    name: Hook latency budget (Windows, not required)
    # Not in pull requests into next (they run the required checks and one Windows job); pushes to main, the nightly
    # run on next, pull requests into main or release branches and the full-ci label measure Windows.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'pull_request' && github.base_ref == 'next' && !contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.schedule == '25 3 * * *' && 'next' || '' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Install
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Measure and check the Windows budget
        run: |
          set -euo pipefail
          if [ ! -f bench/hook_latency_baseline_windows.json ]; then echo "::error::bench/hook_latency_baseline_windows.json is missing"; exit 1; fi
          # Windows runners vary more (five CPU models in 33 runs, per-case spread twice the Linux one), so a single
          # case may move 35 % before it fails; the whole-run check (median of all cases +10 %) still catches a
          # general slowdown. Measured on 33 runs (2026-10-16..20): 1 false failure instead of 5.
          node bench/hook_latency_matrix.js --runs 40 --json "$RUNNER_TEMP/hook_latency.json" --baseline bench/hook_latency_baseline_windows.json --max-increase 0.35 | tee "$RUNNER_TEMP/hook_latency.md"
      - name: Summary
        if: always()
        run: 'if [ -f "$RUNNER_TEMP/hook_latency.md" ]; then { echo "### Windows"; cat "$RUNNER_TEMP/hook_latency.md"; } >> "$GITHUB_STEP_SUMMARY" || true; fi'
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-latency-windows
          path: ${{ runner.temp }}/hook_latency.json
          if-no-files-found: ignore
          retention-days: 30

  # One table with both systems side by side, in the summary of the run.
  latency-compare:
    name: Hook latency, Linux and Windows
    needs: [ latency, latency-windows ]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.schedule == '25 3 * * *' && 'next' || '' }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: hook-latency*
          path: ${{ runner.temp }}/reports
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Table
        run: node bench/hook_latency_summary.js "$RUNNER_TEMP/reports/hook-latency/hook_latency.json" "$RUNNER_TEMP/reports/hook-latency-windows/hook_latency.json" >> "$GITHUB_STEP_SUMMARY"
