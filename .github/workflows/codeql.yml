# CodeQL code scanning of the repository on pull requests, on pushes to main and release branches, nightly, weekly and on demand.
name: CodeQL

# Code scanning with CodeQL (advanced setup), replacing the repository's default setup, which ran on every pull
# request and push (about 12 runs a day) whatever changed. Here it runs:
#   - on pushes to main and release branches, weekly on main, and every night on next (nightly-next.yml starts a
#     manual run there): the alerts of the Security tab come from these runs, and a release commit is analysed on
#     its release branch before the tag;
#   - on pull requests into main, next and release branches, so a finding in new code shows on the pull request before
#     the merge. The analysis reads the code (build-mode none) and never builds or runs it, so the job's
#     security-events: write token is not exposed to code from the pull request. A pull request from a fork gets a
#     read-only token from GitHub and its upload fails; the maintainers' runs on next still cover that code.
# Not a required check. Each run completes: a newer push does not cancel it. The default setup must be turned off in the repository settings (Code security) before this
# workflow takes over; until then GitHub refuses advanced uploads for the same languages.
on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, next, 'release/**' ]
    # A pull request that changes only Markdown, documentation, changelog fragments or images has nothing for
    # CodeQL to read: none of the four languages analyses those files, so the run could not find anything new.
    # This is not a required check, so a skipped run blocks nothing. Pushes, the weekly run and the nightly run
    # on next still analyse everything.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'changelog.d/**'
      - '**/*.png'
      - '**/*.gif'
      - '**/*.svg'
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions: {}

# Every run completes (each has its own group).
concurrency:
  group: codeql-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Decides which languages to analyse. Pull requests into next analyse only the languages whose files changed
  # (actions always); every other run (pull requests into main and release branches, pushes, the weekly run and
  # manual runs) analyses all four. The scope scripts are the ones the other workflows use, and when one of them
  # cannot tell, the language is analysed.
  scope:
    name: CodeQL scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the languages
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          js_py=true
          rust=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "next" ]; then
            # A script that fails or prints nothing leaves the language in.
            out_js="$(bash .github/scripts/ci-scope.sh)" || out_js=""
            out_rs="$(bash .github/scripts/rust-scope.sh)" || out_rs=""
            echo "$out_js"
            echo "$out_rs"
            if grep -qx "run=false" <<< "$out_js"; then js_py=false; fi
            if grep -qx "rust=false" <<< "$out_rs"; then rust=false; fi
          fi
          langs='"actions"'
          if [ "$rust" = "true" ]; then langs="$langs"',"rust"'; fi
          if [ "$js_py" = "true" ]; then langs="$langs"',"javascript-typescript","python"'; fi
          echo "matrix={\"language\":[$langs]}" >> "$GITHUB_OUTPUT"
          echo "languages: $langs"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      # From the scope job: the four languages the default setup scanned (actions, javascript-typescript,
      # python, rust), or fewer on a pull request into next that leaves some untouched.
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default query suite, as the default setup used: a larger suite would open new alerts, and the release
          # gate requires zero open CodeQL alerts. The category below matches the default setup's, so existing alerts
          # carry over instead of reopening.
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
