name: CodeQL

# Code scanning with CodeQL (advanced setup), replacing the repository's default setup, which ran on every pull
# request and push (about 12 runs a day) whatever changed. Here it runs:
#   - on pushes to main and release branches, weekly on main, and every night on next (nightly-next.yml starts a
#     manual run there): the alerts of the Security tab come from these runs, and a release commit is analysed on
#     its release branch before the tag;
#   - on pull requests into main, next and release branches, so a finding in new code shows on the pull request before
#     the merge. The analysis reads the code (build-mode none) and never builds or runs it, so the job's
#     security-events: write token is not exposed to code from the pull request. A pull request from a fork gets a
#     read-only token from GitHub and its upload fails; the maintainers' runs on next still cover that code.
# Not a required check. Each run completes: a newer push does not cancel it. The default setup must be turned off in the repository settings (Code security) before this
# workflow takes over; until then GitHub refuses advanced uploads for the same languages.
on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, next, 'release/**' ]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions: {}

# Every run completes (each has its own group).
concurrency:
  group: codeql-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The languages the default setup scans today (actions, javascript-typescript, python, rust).
        language: [ actions, javascript-typescript, python, rust ]
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default query suite, as the default setup used: a larger suite would open new alerts, and the release
          # gate requires zero open CodeQL alerts. The category below matches the default setup's, so existing alerts
          # carry over instead of reopening.
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
