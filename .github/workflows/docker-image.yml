name: Docker image

# Builds the gateway image from the root Dockerfile (nothing is pushed) and smoke-tests it: it must run as a
# non-root user, print its version, answer the health check and exit cleanly. Runs only when the image
# inputs change, because the build compiles the whole gateway.
on:
  pull_request:
    branches: [ main, next, 'release/**' ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/scripts/docker-smoke.sh'
      - '.github/workflows/docker-image.yml'
  push:
    branches: [ main, next ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/scripts/docker-smoke.sh'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (no push)
        run: docker build --tag zn-smoke:ci .
      - name: Smoke test
        run: bash .github/scripts/docker-smoke.sh zn-smoke:ci
