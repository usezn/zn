name: Link check

# Links in the README, the docs and the package READMEs. Relative links and #anchors are
# checked offline and always fail the job when broken. External links are checked in a
# second step that only reports: a flaky network or a site that is down never fails a pull request.
on:
  pull_request:
    branches: [ main, next, 'release/**' ]
    paths:
      - '**.md'
      - '.github/workflows/link-check.yml'
      - '.github/lychee.toml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for it. Manual runs always complete (each has
# its own group).
concurrency:
  group: link-check-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

env:
  # Pinned release binary; the archive is verified against this SHA-256 before it is unpacked.
  LYCHEE_VERSION: lychee-v0.24.2
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
  LINK_TARGETS: README.md docs packages/*/README.md plugins

jobs:
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/${archive}"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          "$RUNNER_TEMP/lychee" --version
      - name: Relative links and anchors (fails when broken)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/lychee" --config .github/lychee.toml --offline --include-fragments \
            --no-progress \
            --format markdown $LINK_TARGETS
      - name: Restore the external link cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - name: External links (report only)
        continue-on-error: true
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/lychee" --config .github/lychee.toml --cache --max-cache-age 2d \
            --no-progress --format markdown --output "$RUNNER_TEMP/external.md" \
            --scheme https --scheme http $LINK_TARGETS || true
          {
            echo "### External links (informational)"
            echo
            cat "$RUNNER_TEMP/external.md" 2>/dev/null || echo "No report."
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface failures as warnings without failing the job.
          if grep -qE '^\|.*(ERR|Error|\[4[0-9][0-9]\]|\[5[0-9][0-9]\])' "$RUNNER_TEMP/external.md" 2>/dev/null; then
            echo "::warning title=External links::Some external links did not resolve. See the job summary."
          fi
