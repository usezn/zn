name: Public facts

# The version, agents with hooks, license and install command must read the same in every manifest and
# doc of this repository (.github/public-facts.json). A release changes them in the same pull request.
# Pushes always run it. Pull requests and the merge queue always run it too: "Public facts" is a required check,
# and a workflow skipped by a paths filter leaves a required check pending forever. The job takes under a
# minute, so there is no paths filter and no skip step.
on:
  push:
    branches: [ main, next, 'release/**' ]
  pull_request:
    branches: [ main, next, 'release/**' ]
  # The merge queue on next runs the required checks again on the queued commit.
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it, so a burst of
# merges into next tests only the newest commit. Runs for main always complete.
concurrency:
  group: public-facts-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  public-facts:
    name: Public facts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Test the checker
        run: node --test .github/scripts/check-public-facts.test.mjs .github/scripts/check-rule-versions.test.mjs .github/scripts/release-required-checks.test.mjs .github/scripts/npm-dist-tag-plan.test.mjs .github/scripts/license-check.test.mjs .github/scripts/prune-bundled-sources.test.mjs
      - name: Check the public facts
        env:
          # A release pull request (from or into a release/* branch of this repository) is opened
          # before npm publishes the release, so the agent plugin cannot be pinned to it yet.
          # There, a plugin pin one step behind the release is a warning; everything else, and
          # the plugin pin on main and next, still fails. A release pull request into main
          # therefore merges with the plugin behind, and the push run on main fails until the
          # pin commit lands after npm publishes the release.
          PLUGIN_PIN_PENDING: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/')) }}
        run: node .github/scripts/check-public-facts.mjs
      - name: Check the rule versions against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node .github/scripts/check-rule-versions.mjs "origin/${BASE_REF}"
