name: Release dry run

# Builds the release files for an existing tag and stops: nothing is attested,
# signed or published. It is separate from release.yml on purpose. The real
# release builds with setup-node and setup-python, steps that can restore an
# Actions cache, and CodeQL flags them as soon as a workflow that runs from the
# default branch checks out a tag it was given. This workflow therefore uses
# only the tools already on the runner and no cache action at all, and it holds
# read-only permissions. It shows that the tag builds; the real build and its
# provenance come from release.yml and build-release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (dry run, nothing is signed or published), e.g. v1.5.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-dry-run-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Build the tag without signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check the tag name
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Release tooling comes from the dispatched branch, as in the real build.
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: .github
          persist-credentials: false
      - name: Check versions and the branch of the tagged commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          npm_version="$(node -p "require('./packages/zn-gate/package.json').version")"
          py_version="$(python3 -c "import tomllib; print(tomllib.load(open('packages/zn-gate-py/pyproject.toml','rb'))['project']['version'])")"
          base="${tag_version%%-*}"
          expected_py="$base"
          if [ "$tag_version" != "$base" ]; then
            pre="${tag_version#*-}"
            kind="${pre%%.*}"
            num="${pre#*.}"
            case "$kind" in
              alpha) expected_py="${base}a${num}" ;;
              beta) expected_py="${base}b${num}" ;;
              rc) expected_py="${base}rc${num}" ;;
            esac
          fi
          [ "$npm_version" = "$tag_version" ] || { echo "::error::package.json has $npm_version, tag expects $tag_version"; exit 1; }
          [ "$py_version" = "$expected_py" ] || { echo "::error::pyproject.toml has $py_version, tag expects $expected_py"; exit 1; }
          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          if git for-each-ref --contains "$sha" --format='%(refname:short)' refs/remotes/origin | grep -Eq '^origin/(main|release/.+)$'; then
            echo "Tagged commit $sha is on main or a release/* branch"
          else
            echo "::error::Tagged commit $sha is not on main or a release/* branch"; exit 1
          fi
          node --version
          python3 --version
      - name: Set a reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Pack the npm tarball
        working-directory: packages/zn-gate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/pack.json"
      - name: Check tarball contents
        run: node .release-tools/.github/scripts/check-npm-pack.js "$RUNNER_TEMP/pack.json" packages/zn-gate
      - name: Install hash-pinned Python build tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r .release-tools/.github/release-requirements.txt
      - name: Build the sdist and wheel
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation packages/zn-gate-py --outdir "$RUNNER_TEMP/release"
          "$RUNNER_TEMP/build-venv/bin/python" -I .release-tools/.github/scripts/normalize-sdist.py "$RUNNER_TEMP"/release/*.tar.gz
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation packages/zn-gate-py --outdir "$RUNNER_TEMP/rebuild"
          "$RUNNER_TEMP/build-venv/bin/python" -I .release-tools/.github/scripts/normalize-sdist.py "$RUNNER_TEMP"/rebuild/*.tar.gz
          (cd "$RUNNER_TEMP/release" && sha256sum zn_gate-*) > "$RUNNER_TEMP/release.sum"
          (cd "$RUNNER_TEMP/rebuild" && sha256sum zn_gate-*) > "$RUNNER_TEMP/rebuild.sum"
          diff "$RUNNER_TEMP/release.sum" "$RUNNER_TEMP/rebuild.sum" || { echo "::error::the Python sdist or wheel differs between two builds of the same commit"; exit 1; }
          rm -rf "$RUNNER_TEMP/rebuild"
          "$RUNNER_TEMP/build-venv/bin/python" -m twine check --strict "$RUNNER_TEMP"/release/*.whl "$RUNNER_TEMP"/release/*.tar.gz
      - name: Check file names and write SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f \( -name 'zn-gate-*.tgz' -o -name 'zn_gate-*.tar.gz' -o -name 'zn_gate-*.whl' \) | wc -l)"
          [ "$count" -eq 3 ] || { echo "::error::expected 3 release files for $TAG, found $count"; ls -l; exit 1; }
          [ "$(find . -maxdepth 1 -type f | wc -l)" -eq 3 ] || { echo "::error::unexpected extra files"; ls -l; exit 1; }
          sha256sum zn-gate-*.tgz zn_gate-*.tar.gz zn_gate-*.whl | tee SHA256SUMS
      - name: Upload the unsigned build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zn-gate-release-dry-run
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
