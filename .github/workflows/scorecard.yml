name: Scorecard

# OpenSSF Scorecard: checks this repository's supply-chain practices (pinned actions, token permissions,
# branch protection, signed releases, ...). It publishes nothing (publish_results: false) and keeps the
# report as a job artifact; it is not uploaded to code scanning, so it never adds open alerts there.
on:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A new push to a pull request, or to next, cancels the run still going for it. Runs for main, release branches,
# the merge queue and the schedule always complete (each has its own group).
concurrency:
  group: scorecard-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.json
          retention-days: 30
