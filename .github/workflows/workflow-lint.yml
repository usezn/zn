name: Workflow lint

# Lints the GitHub Actions workflows and the composite action of this repository with actionlint
# (syntax, expressions, shell scripts) and zizmor (security: injection, permissions, unpinned or
# impostor actions, cache poisoning). Both tools are pinned: actionlint by a checksum of the release
# archive, zizmor by hashes in .github/workflow-lint/zizmor-requirements.txt. Settings and the few
# justified exceptions live in .github/zizmor.yml and in "zizmor: ignore" comments next to the code.
on:
  pull_request:
    branches: [ main, next, 'release/**' ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/workflow-lint/**'
      - '.github/zizmor.yml'
      - 'action.yml'
  push:
    branches: [ main, next ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/workflow-lint/**'
      - '.github/zizmor.yml'
      - 'action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 of actionlint_<version>_linux_amd64.tar.gz, from the release's checksums file.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          package-manager-cache: false
      - name: Install zizmor (hash pinned)
        run: python -m pip install --require-hashes --no-deps --requirement .github/workflow-lint/zizmor-requirements.txt
      - name: actionlint
        # The runner image ships shellcheck, which actionlint uses to check the scripts in run: steps.
        run: actionlint -color
      - name: zizmor
        env:
          # Read-only token: lets zizmor check pinned commits and action versions against GitHub.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --config .github/zizmor.yml .github/workflows action.yml
