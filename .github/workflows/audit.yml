name: Dependency audit

# Reports known advisories for the dependencies of both packages. It runs on pushes to main and next and
# every day, not on pull requests: an advisory depends on the day it is published more than on the
# change, and these two jobs never fail the run. eslint runs in the Lint job of ci.yml.
on:
  push:
    branches: [main, next]
    paths: ["packages/**", ".github/audit-requirements.txt", ".github/workflows/audit.yml"]
  schedule:
    - cron: "41 6 * * *" # daily advisory check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  # The two audits below only report for now: they never fail the workflow.
  npm-audit:
    name: npm audit (zn-gate, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit
        working-directory: packages/zn-gate
        run: npm audit --omit=dev

  pip-audit:
    name: pip-audit (zn-gate-py, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/audit-requirements.txt
      - name: pip-audit
        run: pip-audit packages/zn-gate-py
