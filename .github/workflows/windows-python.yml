name: Windows checks for the Python package

# Pull requests into next run Python on Ubuntu only. This workflow adds Python 3.12 on Windows when a pull
# request changes the Python package (it has Windows-specific code: paths, file locking, the console) or the
# rule fixtures its tests read. Not a required check. The full Python matrix, Windows included, still runs
# on pushes to main and next, on pull requests into main and release branches, and with the full-ci label.
on:
  pull_request:
    branches: [ next ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'packages/zn-gate-py/**'
      - 'packages/zn-gate/test/fixtures/**'
      - '.github/ci-test-requirements.txt'
      - '.github/workflows/windows-python.yml'
  # The merge queue always runs it: one Windows job on the LTS version is the Windows sample of the queue.
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

concurrency:
  group: windows-python-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  windows-python:
    name: Windows (Python 3.12)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          # No pip cache: the test tools are small and hash-pinned, and each cache key saved a
          # new 200-350 MB copy that pushed the repository toward its 10 GB cache limit.
      - name: Install package and test dependencies
        # Test tools pinned with hashes; the package itself has no dependencies.
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/ci-test-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
      - name: Run pytest (unit + integration)
        working-directory: packages/zn-gate-py
        run: python -m pytest tests/ -v
      - name: Run benchmark verification
        run: python bench/bench_python.py
