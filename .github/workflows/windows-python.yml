name: Windows checks for the Python package

# Python 3.12 on Windows for the merge queue into next (the Python package has Windows-specific code: paths, file
# locking, the console). It runs only in the merge queue: pull requests do not run it (the shared runner pool is the
# bottleneck; they run the required checks and one Windows job, "Windows (Node.js 22)"), and the push to next is the
# commit the queue already checked. Not a required check. Python 3.12 on Windows is also part of ci.yml's full matrix
# (pushes to main and release branches, pull requests into them, and the full-ci label).
on:
  # The merge queue always runs it: one Windows job on the LTS version is the Windows sample of the queue.
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

# Only the merge queue triggers this workflow, so every run has its own group and always completes.
concurrency:
  group: windows-python-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  windows-python:
    name: Windows (Python 3.12)
    # Only the merge queue into next needs this job: a merge queue into main or a release branch skips it, because
    # zn CI already runs its full matrix there (Windows Python 3.12 included). The pull_request conditions below
    # (draft, full-ci label) are inert: this workflow has no pull_request trigger.
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci'))) &&
      (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/next')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # No pip cache: the test tools are small and hash-pinned, and each cache key saved a
          # new 200-350 MB copy that pushed the repository toward its 10 GB cache limit.
      - name: Install package and test dependencies
        # Test tools pinned with hashes; the package itself has no dependencies.
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/ci-test-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
      - name: Run pytest (unit + integration)
        working-directory: packages/zn-gate-py
        run: python -m pytest tests/ -v
      - name: Run benchmark verification
        run: python bench/bench_python.py
