name: Spellcheck

# Checks the spelling of the public prose (docs/, README files, changelog fragments) with crate-ci/typos.
# Exceptions for legitimate words (product names, rule ids, fictitious values) go in .typos.toml, each with
# the reason next to it. To run it locally: `typos docs README.md packages/*/README.md changelog.d`.
on:
  pull_request:
    branches: [ next, main, 'release/**' ]
    paths:
      - 'docs/**'
      - 'README*'
      - 'changelog.d/**'
      - 'packages/*/README.md'
      - '.typos.toml'
      - '.github/workflows/spellcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it. Runs for main, release branches,
# the merge queue and the schedule always complete (each has its own group).
concurrency:
  group: spellcheck-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          files: docs README.md packages/zn-gate/README.md packages/zn-gate-py/README.md changelog.d
          config: .typos.toml
