name: zn-gate scrubber and vault

# Pull requests into next run the checks the rulesets require and Ubuntu with Node.js 22. Pushes to next
# run every Node.js version on Ubuntu and Windows, without macOS. The full matrix (Windows and macOS,
# every Node.js version) runs on pushes to main, on pull requests into main and release branches, on any
# pull request labelled full-ci, and on manual runs.
on:
  push:
    branches: [ main, next ]
    # Documentation-only pushes skip this workflow. Markdown under packages/, plugins/, skill/,
    # bench/ and .github/ still runs it (the package and plugin checks read some of it): a stricter
    # version of the split that .github/scripts/ci-scope.sh makes for pull requests.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'packages/**'
      - 'plugins/**'
      - 'skill/**'
      - 'bench/**'
      - '.github/**'
  pull_request:
    branches: [ next, main, 'release/**' ]
    types: [ opened, synchronize, reopened, labeled, ready_for_review ]
    # No paths filter here: these jobs give required checks, and a workflow skipped by a
    # paths filter leaves them pending. ci-scope.sh skips their steps for documentation instead.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it, so a burst of
# merges into next tests only the newest commit. Runs for main and manual runs always complete.
concurrency:
  group: scrubber-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  scrubber-vault:
    name: scrubber + vault (node ${{ matrix.node }} / ${{ matrix.os }})
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # "scrubber + vault (node 22 / ubuntu-latest)" is a required check: it always runs.
        os: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        node: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '[18, 20, 22, 24]' || '[22]') }}
        # Pushes to next leave macOS out (4 jobs); every other full run keeps it.
        exclude: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/next') && '[{"os":"macos-latest"}]' || '[]') }}
    defaults:
      run:
        working-directory: packages/zn-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/zn-gate/package-lock.json
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - name: Contract and scrubber tests
        if: steps.scope.outputs.run == 'true'
        run: |
          node test/contract.test.js
          node test/scrub_patterns.test.js
          node test/scrub_structured.test.js
          node test/scrub_exact.test.js
          node test/scrub_engine.test.js
      - name: Vault tests (passphrase backend)
        if: steps.scope.outputs.run == 'true'
        run: node test/vault.test.js
      - name: Vault tests (native keychain, Linux Secret Service)
        if: steps.scope.outputs.run == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus-x11 >/dev/null
          dbus-run-session -- bash -c 'printf "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && ZN_TEST_NATIVE_KEYCHAIN=1 node test/vault.test.js'
      - name: Vault tests (native keychain, macOS Keychain)
        if: steps.scope.outputs.run == 'true' && (runner.os == 'macOS')
        run: |
          security create-keychain -p ci-keychain zn-ci.keychain
          security unlock-keychain -p ci-keychain zn-ci.keychain
          ZN_KEYCHAIN_PATH="$HOME/Library/Keychains/zn-ci.keychain-db" ZN_TEST_NATIVE_KEYCHAIN=1 node test/vault.test.js
          security delete-keychain zn-ci.keychain
      - name: Vault tests (native keychain, Windows Credential Manager)
        if: steps.scope.outputs.run == 'true' && (runner.os == 'Windows')
        env:
          ZN_TEST_NATIVE_KEYCHAIN: '1'
        run: node test/vault.test.js
      - name: CLI smoke (unlock, status, lock)
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          ZN_KEYCHAIN_BACKEND: passphrase
        run: |
          export ZN_HOME="$RUNNER_TEMP/zn-cli-home"
          printf 'ci passphrase for the smoke test' | node bin/cli.js unlock --passphrase-stdin --ttl 5m --idle 2m
          node bin/cli.js vault status | grep -q unlocked
          node bin/cli.js vault verify
          node bin/cli.js lock
          node bin/cli.js vault status | grep -q locked
