name: Agent plugins

on:
  push:
    branches: [ main, next ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, next ]

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Plugin checks (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pinning and consistency checks
        run: node plugins/tools/check-plugins.js
      - name: Launcher tests
        run: node plugins/tools/test-launch.js
      - name: Install zn-gate dependencies for the benchmark
        if: hashFiles('plugins/tools/bench-launch.js') != ''
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Launcher overhead benchmark (informational)
        if: hashFiles('plugins/tools/bench-launch.js') != ''
        run: node plugins/tools/bench-launch.js packages/zn-gate

  release:
    # A release tag, main and pull requests into main must carry a pinned lock
    # file (npm integrity,
    # provenance attestation and file digests) and no placeholders.
    name: Release pin checks
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - name: Release checks
        run: node plugins/tools/check-plugins.js --release
