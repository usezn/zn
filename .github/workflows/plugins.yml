name: Agent plugins

on:
  push:
    branches: [ main, next ]
    tags: [ 'v*' ]
    # Documentation-only pushes skip this workflow. Markdown under packages/, plugins/, skill/,
    # bench/ and .github/ still runs it (the package and plugin checks read some of it): a stricter
    # version of the split that .github/scripts/ci-scope.sh makes. Tag pushes ignore path filters.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'packages/**'
      - 'plugins/**'
      - 'skill/**'
      - 'bench/**'
      - '.github/**'
  pull_request:
    branches: [ main, next, 'release/**' ]
    types: [ opened, synchronize, reopened, labeled, ready_for_review ]
    # Pull requests run this workflow (it gives no required check) only when they change what the
    # plugin checks read: the plugins, the marketplace files, the zn-gate version the plugin pins and the
    # hook runner and CLI the launcher benchmark compares against.
    paths:
      - 'plugins/**'
      - 'skill/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.agents/**'
      - 'packages/zn-gate/package.json'
      - 'packages/zn-gate/package-lock.json'
      - 'packages/zn-gate/lib/hooks/**'
      - 'packages/zn-gate/bin/**'
      - '.github/scripts/ci-scope.sh'
      - '.github/workflows/plugins.yml'
      - '.github/workflows/plugin-repo.yml'
  # Daily full run on the default branch.
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it, so a burst of
# merges into next tests only the newest commit. Runs for main, tags and manual runs always complete.
concurrency:
  group: plugins-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  check:
    name: Plugin checks (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        node-version: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["20.19.0", "20.x", "22.x", "24.x", "26.x"]' || '["22.x"]') }}
        # Pushes to next run macOS with Node.js 22.x only; every other full run tests every version.
        # 20.19.0 is the lowest Node.js the plugin supports (its locked dependencies need it), so the floor is tested exactly.
        exclude: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/next') && '[{"os":"macos-latest","node-version":"20.19.0"},{"os":"macos-latest","node-version":"20.x"},{"os":"macos-latest","node-version":"24.x"},{"os":"macos-latest","node-version":"26.x"}]' || '[]') }}
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          package-manager-cache: false
      - name: Pinning and consistency checks
        if: steps.scope.outputs.run == 'true'
        run: node plugins/tools/check-plugins.js
      - name: Launcher tests
        if: steps.scope.outputs.run == 'true'
        run: node plugins/tools/test-launch.js
      - name: Plugin repository generator tests
        if: steps.scope.outputs.run == 'true'
        run: node plugins/tools/test-build-plugin-repo.js
      - name: ZCode plugin tests
        if: steps.scope.outputs.run == 'true'
        run: node plugins/tools/test-zcode-plugin.js
      - name: Codex plugin tests
        if: steps.scope.outputs.run == 'true'
        run: node plugins/tools/test-codex-plugin.js
      - name: Pin commit lookup tests
        if: steps.scope.outputs.run == 'true'
        run: node plugins/tools/test-pin-commit.js
      - name: Install zn-gate dependencies for the benchmark
        if: steps.scope.outputs.run == 'true' && (hashFiles('plugins/tools/bench-launch.js') != '')
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Launcher overhead benchmark (informational)
        if: steps.scope.outputs.run == 'true' && (hashFiles('plugins/tools/bench-launch.js') != '')
        run: node plugins/tools/bench-launch.js packages/zn-gate

  release:
    # A release tag, main and pull requests into main must carry a pinned lock
    # file (npm integrity,
    # provenance attestation and file digests) and no placeholders.
    # Prerelease tags (vX.Y.Z-beta.N) are skipped: the plugin is pinned only to
    # final releases.
    name: Release pin checks
    if: (github.event_name == 'push' && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false
      - name: Release checks
        run: node plugins/tools/check-plugins.js --release
