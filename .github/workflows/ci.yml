# Main test workflow: Node.js, Python, lint, package and build checks on pushes and pull requests to main, next and release branches.
name: zn CI

# Pull requests into next run, all on Ubuntu, the checks of this workflow that the rulesets require: Node.js 18.x,
# 22.x and 24.x (only 22.x runs there; the 18.x and 24.x jobs are skipped, which counts as passed, and run in the
# merge queue),
# Python 3.12, the npm and Python package builds and the lint job. The other required checks (leak bench,
# scrubber + vault, Public facts, and build, test, clippy, fmt) come from other workflows. The Python 3.14
# warnings job is not required. The full matrix (Node.js 18.x, 20.x, 22.x, 24.x and 26.x; Python 3.10 to 3.14,
# Windows and macOS) runs on pull requests into main and release branches, on pushes to main and release
# branches, on the daily schedule, on manual runs, and on any pull request labelled full-ci. A push to next runs
# only the matrix entries the merge queue did not run (Node.js 20.x and 26.x; Python 3.10, 3.11, 3.13, 3.14,
# Windows and macOS). The only macOS job is Python 3.12. The merge queue is enabled for next only; if one is
# enabled for main or a release branch, it runs the full matrix.
on:
  push:
    # release/** is here, and there is no paths filter, because tag-release.yml requires the checks of this
    # workflow (and of the other workflows listed in .github/release-required-checks.txt) on the exact
    # release commit: a documentation-only top commit, such as a changelog edit, must still get all of them.
    branches: [ main, next, 'release/**' ]
  pull_request:
    branches: [ main, next, 'release/**' ]
    types: [ opened, synchronize, reopened, labeled, ready_for_review ]
    # No paths filter here: these jobs give required checks, and a workflow skipped by a
    # paths filter leaves them pending. ci-scope.sh skips their steps for documentation instead.
  # The merge queue (enabled for next only today): the same Node.js and Python entries as a pull request into
  # next, with the Node.js 18.x and 24.x tests running too. If one is enabled for main or a release branch, it
  # runs the full matrix.
  merge_group:
    types: [ checks_requested ]
  # Daily full run on the default branch.
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it, so a burst of
# merges into next tests only the newest commit. Runs for main always complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

env:
  # Retry npm and pip downloads instead of failing a run on one network error.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

jobs:
  test-node:
    name: Node.js ${{ matrix.node-version }} tests & benchmarks
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.x is a required check and runs everywhere. 18.x and 24.x, also required, are the two jobs below.
        # 20.x and 26.x run with the full matrix only.
        # On a push to next the queue already ran 22.x on this commit: only 20.x and 26.x run.
        node-version: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/next') && fromJSON('["20.x", "26.x"]') || fromJSON(((github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["20.x", "22.x", "26.x"]' || '["22.x"]') }}
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-tests
        with:
          node-version: ${{ matrix.node-version }}
          full: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  test-node-18:
    name: Node.js 18.x tests & benchmarks
    # A required check, outside the matrix so that its name is literal: a job skipped by its if reports under
    # this exact name, as skipped, and a skipped job counts as passed for a required check. A matrix job skipped
    # this way would report under its unexpanded name and leave the required check pending.
    # Skipped on pull requests into next without the full-ci label (the merge queue runs it before the merge), on
    # draft pull requests, and on a push to next (the merge queue already ran it on that commit). It runs in the
    # merge queue, on pull requests into main and release branches, on pushes to main and release branches, on
    # the daily schedule, on manual runs and on pull requests labelled full-ci.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/next') && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.base_ref != 'next' || contains(github.event.pull_request.labels.*.name, 'full-ci')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-tests
        with:
          node-version: 18.x
          full: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  test-node-24:
    name: Node.js 24.x tests & benchmarks
    # A required check, outside the matrix so that its name is literal: a job skipped by its if reports under
    # this exact name, as skipped, and a skipped job counts as passed for a required check. A matrix job skipped
    # this way would report under its unexpanded name and leave the required check pending.
    # Skipped on pull requests into next without the full-ci label (the merge queue runs it before the merge), on
    # draft pull requests, and on a push to next (the merge queue already ran it on that commit). It runs in the
    # merge queue, on pull requests into main and release branches, on pushes to main and release branches, on
    # the daily schedule, on manual runs and on pull requests labelled full-ci.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/next') && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.base_ref != 'next' || contains(github.event.pull_request.labels.*.name, 'full-ci')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-tests
        with:
          node-version: 24.x
          full: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  # Pull requests into next run Python 3.12 on Ubuntu only. Older and newer Python versions, Windows and
  # macOS run on the push to next, on pull requests into main and release branches, on a merge queue for main
  # or a release branch if one is enabled, and on pull requests labelled full-ci (so they run before the merge).
  test-python:
    name: Python ${{ matrix.python-version }} tests & benchmarks (${{ matrix.os }})
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # "Python 3.12 tests & benchmarks (ubuntu-latest)" is a required check (plain pytest; the coverage
        # report is the python-coverage job): it is in both lists. The
        # list depends only on the event (never on another job), so every job name is known when the
        # run starts.
        # On a push to next the queue already ran Python 3.12 on Ubuntu on this commit: only the other entries run.
        include: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/next') && fromJSON('[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.12"}]') || fromJSON(((github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.12"}]' || '[{"os":"ubuntu-latest","python-version":"3.12"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - name: Set up Python ${{ matrix.python-version }}
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # No pip cache: the test tools are small and hash-pinned, and each cache key saved a
          # new 200-350 MB copy that pushed the repository toward its 10 GB cache limit.
      - name: Install package and test dependencies
        if: steps.scope.outputs.run == 'true'
        # Test tools pinned with hashes; the package itself has no dependencies.
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/ci-test-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
      - name: Install LangChain and LlamaIndex for the integration tests
        # One entry is enough: the tests that drive the integrations through the real frameworks run here
        # and skip on the other entries.
        if: steps.scope.outputs.run == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/ci-framework-test-requirements.txt
      - name: Run pytest (unit + integration)
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate-py
        env:
          # Where the frameworks were installed above, their tests must run, not skip.
          ZN_REQUIRE_FRAMEWORKS: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '1' || '' }}
        run: python -m pytest tests/ -v
      - name: Run the LangChain and LlamaIndex integration tests on the oldest supported langchain-core
        # The same real-framework tests, in a separate virtual environment with langchain-core 1.3.3, the
        # oldest version the integration supports. The frameworks are installed: the tests must run, not skip.
        if: steps.scope.outputs.run == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          ZN_REQUIRE_FRAMEWORKS: "1"
        run: |
          python -m venv "$RUNNER_TEMP/venv-oldest-langchain"
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pip install --require-hashes -r .github/ci-test-requirements.txt
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pip install --require-hashes -r .github/ci-framework-test-requirements-oldest.txt
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -c "import langchain_core; assert langchain_core.__version__ == '1.3.3', langchain_core.__version__"
          cd packages/zn-gate-py
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pytest tests/test_langchain_real.py tests/test_llamaindex_real.py -v
      - name: Run benchmark verification
        if: steps.scope.outputs.run == 'true'
        run: python bench/bench_python.py

  # The Python package on the newest Python with deprecation and resource warnings as errors, in pull requests
  # too: a call that a future Python removes, or a file or socket left open, fails here instead of in a user's
  # upgrade. No -X dev: its debug checks multiply the run time and break the linear-time tests.
  python-warnings:
    name: Python 3.14 tests with warnings as errors (ubuntu-latest)
    # Draft pull requests skip this job; marking the pull request ready for review runs it. Not a required check,
    # so the merge queue leaves it out: it runs in pull requests and on the push to next.
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: bash .github/scripts/ci-scope.sh
      - name: Set up Python 3.14
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install package and test dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/ci-test-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
      - name: Run pytest with deprecation and resource warnings as errors
        # pytest reports a file or socket closed by the garbage collector as PytestUnraisableExceptionWarning, not as a
        # ResourceWarning, so that category is an error too: without it an unclosed file does not fail the job.
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate-py
        run: python -W error::DeprecationWarning -W error::ResourceWarning -m pytest tests/ -q -W error::DeprecationWarning -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning

  # The coverage report for the Python package, off the pull request path: "Python 3.12 tests & benchmarks
  # (ubuntu-latest)" above is a required check and runs plain pytest, so the tracing slowdown and the
  # report upload never delay a merge. Runs on pushes (main, next and release branches), on the daily schedule and on
  # manual runs; it is not a required check. Report only, no threshold.
  python-coverage:
    name: Python 3.12 coverage report (ubuntu-latest)
    # Not in pull requests or the merge queue: it is a report, not a required check.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/ci-test-requirements.txt
          # The real-framework tests (LangChain, LlamaIndex) must run in the report, not skip: without them
          # integrations/langchain.py reads about 40 % instead of about 93 %.
          python -m pip install --require-hashes -r .github/ci-framework-test-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
      - name: Run pytest (unit + integration) with a coverage report
        env:
          ZN_REQUIRE_FRAMEWORKS: "1"
        # One wall-clock test is left out here (tracing slows it past its limit); the required job runs it untraced.
        working-directory: packages/zn-gate-py
        run: |
          python -m pytest tests/ -v --deselect tests/test_cli.py::TestCliScanCommand::test_many_key_blocks_scan_in_linear_time --cov=zn_gate --cov-report=term --cov-report=xml:"$RUNNER_TEMP/coverage-python.xml" 2>&1 | tee "$RUNNER_TEMP/coverage-python.log"
          {
            echo '### zn-gate (Python) coverage'
            echo '```'
            grep -E '^TOTAL' "$RUNNER_TEMP/coverage-python.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: ${{ runner.temp }}/coverage-python.xml
          if-no-files-found: ignore
          retention-days: 14

  # One job for the linters: eslint on zn-gate (rules in .github/eslint), ruff and mypy on the Python
  # package (rules in packages/zn-gate-py/pyproject.toml). Each one blocks the run, and each runs even
  # when an earlier one failed, so one run reports all of them.
  lint:
    name: Lint (eslint, ruff, mypy)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    # A push to next is the commit the merge queue already checked: the jobs and legs the queue ran on that commit
    # (the required checks) are skipped there; the push runs only what the queue does not.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: bash .github/scripts/ci-scope.sh
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Install the eslint tooling
        id: eslint-tools
        if: steps.scope.outputs.run == 'true'
        working-directory: .github/eslint
        run: npm ci --ignore-scripts
      - name: eslint
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' && steps.eslint-tools.outcome == 'success' }}
        working-directory: packages/zn-gate
        run: ../../.github/eslint/node_modules/.bin/eslint -c ../../.github/eslint/eslint.config.mjs --max-warnings 0 .
      - name: Set up Python
        id: python
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # No pip cache: the test tools are small and hash-pinned, and each cache key saved a
          # new 200-350 MB copy that pushed the repository toward its 10 GB cache limit.
      - name: Install ruff and mypy
        id: python-tools
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        # Pinned with hashes in the same file as the test tools.
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/ci-test-requirements.txt
      - name: Run ruff
        if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
        working-directory: packages/zn-gate-py
        run: python -m ruff check .
      - name: Test the CI helper scripts
        if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
        run: |
          python -m pytest .github/scripts/test_normalize_sdist.py .github/scripts/test_doc_snippets.py -q
          python -m ruff check .github/scripts/test_normalize_sdist.py .github/scripts/test_doc_snippets.py
      - name: Run mypy
        if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
        working-directory: packages/zn-gate-py
        run: python -m mypy
      - name: Run mypy --strict on the public API
        if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
        # Blocking. The modules behind everything in zn_gate.__all__ are checked in
        # strict mode, together with a file of type-level assertions that fails to
        # type-check if a public signature changes shape.
        working-directory: packages/zn-gate-py
        run: >-
          python -m mypy --strict
          src/zn_gate/__init__.py src/zn_gate/rules.py src/zn_gate/guard.py
          src/zn_gate/client.py src/zn_gate/evidence.py
          typing_check/check_public_api.py
      - name: Test the PyPI license checker
        if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
        run: python -m pytest -q .github/scripts/test_license_check_py.py .github/scripts/test_check_license_allowlist.py

  pack-node:
    name: npm package (pack, inspect, install)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    # A push to next is the commit the merge queue already checked: the jobs and legs the queue ran on that commit
    # (the required checks) are skipped there; the push runs only what the queue does not.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          package-manager-cache: false
          node-version: 22.x
      - name: Install dependencies (bundled into the tarball)
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Prune sources and maps from the bundled dependencies
        if: steps.scope.outputs.run == 'true'
        run: node .github/scripts/prune-bundled-sources.js packages/zn-gate
      - name: Pack
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack/pack.json"
          ls -l "$RUNNER_TEMP/pack"
      - name: Check tarball contents
        if: steps.scope.outputs.run == 'true'
        run: node .github/scripts/check-npm-pack.js "$RUNNER_TEMP/pack/pack.json" packages/zn-gate
      - name: Install the tarball in an empty project (offline)
        if: steps.scope.outputs.run == 'true'
        run: | # zizmor: ignore[adhoc-packages] the tarball just built by this job is installed offline
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --offline --no-audit --no-fund "$RUNNER_TEMP"/pack/zn-gate-*.tgz
      - name: Smoke test the installed CLI
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/smoke
        run: |
          expected="$(node -p "require('./node_modules/zn-gate/package.json').version")"
          version_line="$(npx --no-install zn-gate --version)"
          echo "$version_line"
          case "$version_line" in
            "zn-gate $expected "*) ;;
            *) echo "unexpected version output, expected zn-gate $expected"; exit 1 ;;
          esac
          npx --no-install zn-gate test
      - name: Check the bundled vault crypto loads
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/smoke
        run: >-
          node -e "require('zn-gate/lib/vault/store.js').generateIdentity()
          .then((r) => { if (!/^age1/.test(r.recipient)) process.exit(1); console.log('vault crypto OK'); })
          .catch((e) => { console.error(e); process.exit(1); })"
      - name: Upload tarball
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zn-gate-npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 7

  build-python:
    name: Python package (build, twine check, install)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    # A push to next is the commit the merge queue already checked: the jobs and legs the queue ran on that commit
    # (the required checks) are skipped there; the push runs only what the queue does not.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || github.event.merge_group.base_ref == 'refs/heads/main' || startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          # No pip cache: the test tools are small and hash-pinned, and each cache key saved a
          # new 200-350 MB copy that pushed the repository toward its 10 GB cache limit.
      - name: Install build tools
        if: steps.scope.outputs.run == 'true'
        # The hash-pinned tools the release workflow uses.
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          python -m pip install --require-hashes -r .github/release-requirements.txt
      - name: Build sdist and wheel, twice, and require the same bytes
        if: steps.scope.outputs.run == 'true'
        # setuptools stamps the files it generates with the build time; normalize-sdist.py keeps every
        # name and byte of content and fixes the times, owners, order and gzip header.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          for out in dist rebuild; do
            python -m build --no-isolation packages/zn-gate-py --outdir "$RUNNER_TEMP/$out"
            python -I .github/scripts/normalize-sdist.py "$RUNNER_TEMP"/$out/*.tar.gz
          done
          (cd "$RUNNER_TEMP/dist" && sha256sum zn_gate-*) > "$RUNNER_TEMP/dist.sum"
          (cd "$RUNNER_TEMP/rebuild" && sha256sum zn_gate-*) > "$RUNNER_TEMP/rebuild.sum"
          cat "$RUNNER_TEMP/dist.sum"
          diff "$RUNNER_TEMP/dist.sum" "$RUNNER_TEMP/rebuild.sum" || { echo "::error::the Python sdist or wheel differs between two builds of the same commit"; exit 1; }
          rm -rf "$RUNNER_TEMP/rebuild"
      - name: twine check
        if: steps.scope.outputs.run == 'true'
        run: python -m twine check --strict "$RUNNER_TEMP"/dist/*
      - name: Check wheel and sdist contents
        if: steps.scope.outputs.run == 'true'
        run: |
          python -I .github/scripts/test_check_python_pack.py
          python -I .github/scripts/check-python-pack.py "$RUNNER_TEMP"/dist/*.whl "$RUNNER_TEMP"/dist/*.tar.gz
      - name: List sdist contents
        if: steps.scope.outputs.run == 'true'
        run: tar -tzf "$RUNNER_TEMP"/dist/*.tar.gz
      - name: Install the wheel in a fresh virtualenv
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --requirement .github/pip-bootstrap-requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
      - name: Smoke test the installed CLI
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/zn-gate" --version
          "$RUNNER_TEMP/venv/bin/python" -c "import zn_gate, zn_gate.integrations; print(zn_gate.__file__)"
      - name: Upload distributions
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zn-gate-python-dist
          path: ${{ runner.temp }}/dist/*
          retention-days: 7
