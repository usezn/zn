name: zn CI

# Pull requests into next run the checks the rulesets require and Ubuntu with Node.js 22. The full matrix
# (every Node.js and Python version, Windows and macOS) runs on pushes to main and next, on pull requests
# into main and release branches, and on any pull request labelled full-ci. Its only macOS job is Python 3.12.
# A pull request into next that changes the Python package, the Node package it shares fixtures with,
# bench/ or this workflow also runs the whole Python matrix.
on:
  push:
    branches: [ main, next ]
    # Documentation-only pushes skip this workflow. Markdown under packages/, plugins/, skill/,
    # bench/ and .github/ still runs it (the package and plugin checks read some of it): a stricter
    # version of the split that .github/scripts/ci-scope.sh makes for pull requests.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'packages/**'
      - 'plugins/**'
      - 'skill/**'
      - 'bench/**'
      - '.github/**'
  pull_request:
    branches: [ main, next, 'release/**' ]
    types: [ opened, synchronize, reopened, labeled, ready_for_review ]
    # No paths filter here: these jobs give required checks, and a workflow skipped by a
    # paths filter leaves them pending. ci-scope.sh skips their steps for documentation instead.

permissions:
  contents: read

# A new push to a pull request, or to next, cancels the run still going for it, so a burst of
# merges into next tests only the newest commit. Runs for main always complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/next') && 'next' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

jobs:
  test-node:
    name: Node.js ${{ matrix.node-version }} tests & benchmarks
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 18.x, 22.x and 24.x are required checks: they always run.
        node-version: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["18.x", "20.x", "22.x", "24.x"]' || '["18.x", "22.x", "24.x"]') }}
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/zn-gate/package-lock.json
      - name: Install zn-gate dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Run zn-gate unit tests
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate
        run: npm test
      - name: Run zn-gate integration tests
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate
        run: node test/integration/test_agent_workflows.js
      - name: Run benchmark verification
        if: steps.scope.outputs.run == 'true'
        run: node bench/bench_node.js

  # The Python tests also read files from packages/zn-gate (rule fixtures) and run bench/bench_python.py.
  # A pull request into next that touches any of them runs the whole Python matrix, not only 3.12:
  # a failure on an older Python version must show up before the merge, not on the push to next.
  test-python:
    name: Python ${{ matrix.python-version }} tests & benchmarks (${{ matrix.os }})
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The matrix is fixed so that every job name is known when the run starts (a matrix built from
        # another job leaves a check with an unexpanded name when the run is cancelled early).
        # "Python 3.12 tests & benchmarks (ubuntu-latest)" is a required check: it always runs. The
        # other entries decide in their first step whether this change needs them and end quickly if not.
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this matrix entry runs
        id: entry
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Pushes, pull requests into main or a release branch and full-ci pull requests run every entry.
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PRIMARY: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
          PY_VERSION: ${{ matrix.python-version }}
          RUNNER_OS_NAME: ${{ matrix.os }}
        working-directory: .
        run: |
          # A pull request into next that touches the Python package, the Node package it shares fixtures
          # with, bench/ or the CI setup runs the whole matrix; any other one runs Python 3.12 on Ubuntu only.
          # Any error while listing the files means the full matrix: when in doubt, test more.
          run=true
          if [ "$PRIMARY" != "true" ] && [ "$FULL" != "true" ]; then
            if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git fetch --no-tags --depth=1 origin "$BASE_SHA" > /dev/null 2>&1 \
               && files="$(git diff --no-renames --name-only "$BASE_SHA" HEAD)"; then
              # An empty list (no net change) is a doubt too: keep the entry.
              [ -n "$files" ] && run=false
              while IFS= read -r f; do
                case "$f" in
                  packages/zn-gate-py/*|packages/zn-gate/*|bench/*|.github/workflows/ci.yml|.github/ci-test-requirements.txt|.github/scripts/ci-scope.sh)
                    run=true; echo "runs the full Python matrix: $f"; break ;;
                esac
              done <<< "$files"
            fi
          fi
          [ "$run" = "true" ] || echo "this change does not need Python $PY_VERSION on $RUNNER_OS_NAME"
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      - name: Decide what this change needs
        id: scope
        if: steps.entry.outputs.run == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - name: Set up Python ${{ matrix.python-version }}
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/zn-gate-py/pyproject.toml
            .github/ci-test-requirements.txt
      - name: Install package and test dependencies
        if: steps.scope.outputs.run == 'true'
        # Test tools pinned with hashes; the package itself has no dependencies.
        run: |
          python -m pip install --require-hashes -r .github/ci-test-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
      - name: Install LangChain and LlamaIndex for the integration tests
        # One entry is enough: the tests that drive the integrations through the real frameworks run here
        # and skip on the other entries.
        if: steps.scope.outputs.run == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install --require-hashes -r .github/ci-framework-test-requirements.txt
      - name: Run pytest (unit + integration)
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate-py
        env:
          # Where the frameworks were installed above their tests must run, not skip.
          ZN_REQUIRE_FRAMEWORKS: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '1' || '' }}
        run: python -m pytest tests/ -v
      - name: Run the LangChain and LlamaIndex integration tests on the oldest supported langchain-core
        # The same real-framework tests, in a separate virtual environment with langchain-core 1.3.3, the
        # oldest version the integration supports. The frameworks are installed: the tests must run, not skip.
        if: steps.scope.outputs.run == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          ZN_REQUIRE_FRAMEWORKS: "1"
        run: |
          python -m venv "$RUNNER_TEMP/venv-oldest-langchain"
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pip install --require-hashes -r .github/ci-test-requirements.txt
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pip install --require-hashes -r .github/ci-framework-test-requirements-oldest.txt
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pip install --no-deps --no-build-isolation -e packages/zn-gate-py
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -c "import langchain_core; assert langchain_core.__version__ == '1.3.3', langchain_core.__version__"
          cd packages/zn-gate-py
          "$RUNNER_TEMP/venv-oldest-langchain/bin/python" -m pytest tests/test_langchain_real.py tests/test_llamaindex_real.py -v
      - name: Run benchmark verification
        if: steps.scope.outputs.run == 'true'
        run: python bench/bench_python.py

  pack-node:
    name: npm package (pack, inspect, install)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: packages/zn-gate/package-lock.json
      - name: Install dependencies (bundled into the tarball)
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate
        run: npm ci --ignore-scripts
      - name: Pack
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/zn-gate
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack/pack.json"
          ls -l "$RUNNER_TEMP/pack"
      - name: Check tarball contents
        if: steps.scope.outputs.run == 'true'
        run: node .github/scripts/check-npm-pack.js "$RUNNER_TEMP/pack/pack.json" packages/zn-gate
      - name: Install the tarball in an empty project (offline)
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --offline --no-audit --no-fund "$RUNNER_TEMP"/pack/zn-gate-*.tgz
      - name: Smoke test the installed CLI
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/smoke
        run: |
          expected="$(node -p "require('./node_modules/zn-gate/package.json').version")"
          version_line="$(npx --no-install zn-gate --version)"
          echo "$version_line"
          case "$version_line" in
            "zn-gate $expected "*) ;;
            *) echo "unexpected version output, expected zn-gate $expected"; exit 1 ;;
          esac
          npx --no-install zn-gate test
      - name: Check the bundled vault crypto loads
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ runner.temp }}/smoke
        run: >-
          node -e "require('zn-gate/lib/vault/store.js').generateIdentity()
          .then((r) => { if (!/^age1/.test(r.recipient)) process.exit(1); console.log('vault crypto OK'); })
          .catch((e) => { console.error(e); process.exit(1); })"
      - name: Upload tarball
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zn-gate-npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 7

  build-python:
    name: Python package (build, twine check, install)
    # Draft pull requests skip this job; marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/zn-gate-py/pyproject.toml
            .github/release-requirements.txt
      - name: Install build tools
        if: steps.scope.outputs.run == 'true'
        # The hash-pinned tools the release workflow uses.
        run: python -m pip install --require-hashes -r .github/release-requirements.txt
      - name: Build sdist and wheel, twice, and require the same bytes
        if: steps.scope.outputs.run == 'true'
        # setuptools stamps the files it generates with the build time; normalize-sdist.py keeps every
        # name and byte of content and fixes the times, owners, order and gzip header.
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for out in dist rebuild; do
            python -m build --no-isolation packages/zn-gate-py --outdir "$RUNNER_TEMP/$out"
            python -I .github/scripts/normalize-sdist.py "$RUNNER_TEMP"/$out/*.tar.gz
          done
          (cd "$RUNNER_TEMP/dist" && sha256sum zn_gate-*) > "$RUNNER_TEMP/dist.sum"
          (cd "$RUNNER_TEMP/rebuild" && sha256sum zn_gate-*) > "$RUNNER_TEMP/rebuild.sum"
          cat "$RUNNER_TEMP/dist.sum"
          diff "$RUNNER_TEMP/dist.sum" "$RUNNER_TEMP/rebuild.sum" || { echo "::error::the Python sdist or wheel differs between two builds of the same commit"; exit 1; }
          rm -rf "$RUNNER_TEMP/rebuild"
      - name: twine check
        if: steps.scope.outputs.run == 'true'
        run: python -m twine check --strict "$RUNNER_TEMP"/dist/*
      - name: List sdist contents
        if: steps.scope.outputs.run == 'true'
        run: tar -tzf "$RUNNER_TEMP"/dist/*.tar.gz
      - name: Install the wheel in a fresh virtualenv
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
      - name: Smoke test the installed CLI
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/zn-gate" --version
          "$RUNNER_TEMP/venv/bin/python" -c "import zn_gate, zn_gate.integrations; print(zn_gate.__file__)"
      - name: Upload distributions
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zn-gate-python-dist
          path: ${{ runner.temp }}/dist/*
          retention-days: 7
