name: Support for another agent
description: Ask for zn-gate to support an AI agent or editor it does not cover yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        zn-gate adds an agent only when people ask for it. This form tells us which agents matter to you and what we would need to check before we could add one. It is not a promise of support. For questions, use [GitHub Discussions](https://github.com/usezn/zn/discussions). If you found a security problem, do not open an issue: follow the [security policy](https://github.com/usezn/zn/security/policy).
  - type: input
    id: agent-name
    attributes:
      label: Agent name and official site
      description: The name of the agent and the link to its official website or documentation.
      placeholder: "for example Example Agent, https://agent.example.com"
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      description: The version you use, from the agent's about screen or its version command.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - "macOS"
        - "Linux"
        - "Windows"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: hooks
    attributes:
      label: Does the agent have a hook or plugin API that can run a command before a tool call?
      description: Check the agent's official documentation. Pick "Not sure" if you have not checked.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: hooks-docs
    attributes:
      label: Link to the official hooks or plugin documentation
      description: Required if you answered Yes above.
  - type: checkboxes
    id: actions
    attributes:
      label: Which actions can the agent take?
      description: Select all that apply.
      options:
        - label: Run shell commands
        - label: Write or edit files
        - label: Call tools from MCP servers
        - label: Other (describe in additional context)
  - type: input
    id: config-location
    attributes:
      label: Where its settings live
      description: Only if the official documentation says so. Otherwise leave this empty.
  - type: textarea
    id: install
    attributes:
      label: How it is installed
      description: For example an installer, a package manager or a desktop download. Add the official install page if there is one.
  - type: dropdown
    id: headless
    attributes:
      label: Can the agent run without a window or an interactive prompt, for example from a script?
      description: We need this to test zn-gate on the agent automatically. Pick "Not sure" if you do not know.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Your use case and how many people would use it
      description: What you use the agent for, and how many people on your team or in your community would use zn-gate with it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links or notes, for example about other actions the agent can take. Do not paste secrets or personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, including closed ones, and did not find a request for this agent.
          required: true
        - label: I removed every secret and personal detail from this report.
          required: true
