# Version updates go to the integration branch. Security updates always
# target the default branch (GitHub behaviour).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/fuzz"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-fuzz:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/.github/markdownlint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/packages/zn-gate"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/plugins/zn-gate"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/.github/sbom-tools"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: "/packages/zn-gate-py"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/.github"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/.github/workflow-lint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: "/.github/eslint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      lint-tooling:
        patterns: ["*"]
