# Version updates go to the integration branch. Security updates always
# target the default branch (GitHub behaviour).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/fuzz"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-fuzz:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/.github/markdownlint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/packages/zn-gate"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/plugins/zn-gate"
    target-branch: next
    schedule:
      interval: weekly
    # Security updates only. The release pins zn-gate and writes
    # scripts/zn-gate.lock.json (plugins/tools/pin-release.js); a version bump
    # from Dependabot would leave that lock out of sync.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "zn-gate"
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/.github/sbom-tools"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: "/packages/zn-gate-py"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/.github"
    target-branch: next
    schedule:
      interval: weekly
    # Security updates only. The requirement files here are generated with uv
    # and some minimum versions are deliberate (ci-framework-test-requirements-oldest.txt).
    open-pull-requests-limit: 0
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/.github/workflow-lint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: "/.github/eslint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      lint-tooling:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/.github/npm-cli"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-cli:
        patterns: ["*"]
        update-types: [minor, patch]

  # Example projects: grouped minor/patch updates, low limit so they do not
  # crowd the PR queue.
  - package-ecosystem: npm
    directories:
      - "/examples/langchain-js"
      - "/examples/mastra-agent"
      - "/examples/openai-agents-js"
      - "/examples/vercel-ai-sdk"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      examples-npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - "/examples/ag2-agent"
      - "/examples/crewai-agent"
      - "/examples/dspy-agent"
      - "/examples/google-adk-agent"
      - "/examples/haystack-agent"
      - "/examples/llamaindex-agent"
      - "/examples/openai-agents-sdk"
      - "/examples/pydantic-ai-agent"
      - "/examples/semantic-kernel-agent"
      - "/examples/smolagents-agent"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      examples-pip:
        patterns: ["*"]
        update-types: [minor, patch]
