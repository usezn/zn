# Version updates go to the integration branch. Security updates always
# target the default branch (GitHub behaviour).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # fuzz/ is not a Dependabot entry: its updates edit the root Cargo.toml
    # without fuzz/Cargo.lock, so they can never pass "cargo build --locked".
    ignore:
      # tokenizers follows the ML model dependency; a new minor or major
      # release is taken together with that change, not on its own.
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]


  - package-ecosystem: npm
    directory: "/.github/markdownlint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/packages/zn-gate"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/plugins/zn-gate"
    target-branch: next
    schedule:
      interval: weekly
    # Security updates only. The release pins zn-gate and writes
    # scripts/zn-gate.lock.json (plugins/tools/pin-release.js); a version bump
    # from Dependabot would leave that lock out of sync.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "zn-gate"
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/.github/sbom-tools"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: "/packages/zn-gate-py"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The package declares minimum versions. Raise one only when the new
    # version no longer fits the range, instead of raising every lower bound.
    versioning-strategy: increase-if-necessary
    ignore:
      # Build backend floor, kept low on purpose for older pip and build tools.
      - dependency-name: "setuptools"
      # Optional LangChain integration, a test-only dependency. Its floor is the oldest version the
      # integration supports and the CI job "oldest supported langchain-core" tests it, so a newer
      # release must not raise it.
      - dependency-name: "langchain-core"
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/.github"
    target-branch: next
    schedule:
      interval: weekly
    # Security updates only. The requirement files here are generated with uv
    # and some minimum versions are deliberate (ci-framework-test-requirements-oldest.txt).
    open-pull-requests-limit: 0
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/.github/workflow-lint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: "/.github/eslint"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      lint-tooling:
        patterns: ["*"]
