# cargo-deny configuration: licenses, bans and sources only.
# Known vulnerabilities are already checked by `cargo audit` in cargo-audit.yml,
# so the advisories section is left out on purpose.
#
# The allowed licenses are the permissive ones the project accepts. They are
# the same as .github/license-allowlist.txt (derived from
# packages/zn-gate/THIRD_PARTY_NOTICES.md), plus "Apache-2.0 WITH
# LLVM-exception". .github/scripts/check-license-allowlist.py (job
# license-lists in dependency-review.yml) fails when the two differ. Anything else (for example MPL-2.0 or CC0-1.0) is
# reported as a finding for a person to review.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# Per-crate exceptions for licences that appear only on these crates in Cargo.lock.
# cargo-deny warns when an entry matches no crate in the workspace graph, so
# add one only when a finding names a crate that is actually reached.
[[licenses.exceptions]]
# CC0-1.0 alone (no OR alternative): a public-domain dedication.
name = "notify"
version = "6.1.1"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
# CDLA-Permissive-2.0 alone: root certificate data.
name = "webpki-root-certs"
version = "1.0.10"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Two versions of one crate are common in a large tree: report, do not fail.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
# getrandom has three versions in Cargo.lock. The two older ones are skipped
# because their direct parents still depend on them:
#   0.2.17 <- jsonwebtoken 10.4.0, ring 0.17.14
#   0.3.4  <- rand_core 0.9.5, ahash 0.8.12, governor 0.10.4,
#             tokenizers 0.22.2 and 0.23.2
#   0.4.3  <- crypto-common, password-hash, phc, rand 0.10, tempfile,
#             uuid, zip, jobserver (build dependency)
# Unifying them needs newer releases of those parents. Re-check with
# `cargo tree --locked -i getrandom@<version> --depth 1` when Cargo.lock changes.
skip = [
    { crate = "getrandom@0.2.17", reason = "pulled by jsonwebtoken 10.4.0 and ring 0.17.14, which still depend on getrandom 0.2" },
    { crate = "getrandom@0.3.4", reason = "pulled by rand_core 0.9.5, ahash 0.8.12, governor 0.10.4 and tokenizers 0.22/0.23, which still depend on getrandom 0.3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
