# cargo-deny configuration: licenses, bans and sources only.
# Known vulnerabilities are already checked by `cargo audit` in rust.yml,
# so the advisories section is left out on purpose.
#
# The allowed licenses are the permissive ones the project accepts. They are
# the same as .github/license-allowlist.txt (derived from
# packages/zn-gate/THIRD_PARTY_NOTICES.md), plus a few permissive licenses
# that only Rust crates use (Unicode-3.0, Zlib, Apache-2.0 WITH
# LLVM-exception). Anything else (for example MPL-2.0 or CC0-1.0) is
# reported as a finding for a person to review.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Two versions of one crate are common in a large tree: report, do not fail.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
