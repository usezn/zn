[extend]
useDefault = true

[allowlist]
description = "Allowlist synthetic test fixtures and documentation mock tokens"
regexes = [
  '''ghp_1234567890abcdefghijklmnopqrstuvwxyzAB''',
  '''ghp_1234567890abcdefghijklmnopqrstuvwxyz''',
  '''sk-proj-1234567890abcdef1234567890abcdef''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
]
paths = [
  '''test/.*''',
  '''tests/.*''',
  '''.*\.test\.js''',
  '''examples/.*''',
  '''bench/.*''',
  '''packages/zn-gate/test/.*''',
  '''packages/zn-gate-py/tests/.*''',
  # packages/zn-gate/test/fixtures/fake_secrets.js is the deterministic generator of
  # SYNTHETIC secrets for the leak bench: fabricated values from a fixed PRNG
  # seed, never real credentials. Allowlisted explicitly so its format-valid fake
  # prefixes never fail a scan; this entry exempts that one file and nothing else.
  '''packages/zn-gate/test/fixtures/fake_secrets\.js''',
]
