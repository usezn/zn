name: 'zn-gate AI Agent Security Linter'
description: 'Fast, deterministic security scanner and prompt-injection linter for AI agent prompts, tools, and configurations.'
author: 'zn <admin@usezn.com>'
branding:
  icon: 'shield'
  color: 'green'

# The action installs the published zn-gate package from PyPI at the exact
# version given in `version`; it does not run code from this repository.
# `version` defaults to the current stable release and is bumped when a new
# release is cut.

inputs:
  version:
    description: 'zn-gate version to install from PyPI, as an exact version number (for example 1.4.1). Ranges and "latest" are not accepted.'
    required: false
    default: '1.5.1'
  package-sha256:
    description: 'Optional SHA-256 of the zn-gate wheel for `version` (as listed on PyPI). When set, pip refuses to install a file with a different hash.'
    required: false
    default: ''
  path:
    description: 'Path or directory to scan for prompt injections and leaked secrets'
    required: false
    default: '.'
  fail-on-threat:
    description: 'Whether to fail the CI step if any threat is detected (true/false)'
    required: false
    default: 'true'
  format:
    description: 'Output format: github (default, with inline annotations), text, or json'
    required: false
    default: 'github'

outputs:
  scan-exit-code:
    description: 'Exit code of zn-gate scan (0 clean or fail-on-threat false, 1 threats found, 2 error); empty if the scan did not run'
    value: ${{ steps.scan.outputs.scan-exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install zn-gate
      id: install
      shell: bash
      env:
        ZN_VERSION: ${{ inputs.version }}
        ZN_SHA256: ${{ inputs.package-sha256 }}
        ZN_VENV: ${{ runner.temp }}/zn-gate-venv
        ZN_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        # Run outside the scanned workspace; every Python call below also uses -I,
        # so no module from the workspace (venv, pip, zn_gate) can be imported.
        cd "$ZN_TEMP"
        # Exact release versions only (1.4.1, 1.5.0b1, 1.5.0rc1, 1.5.0.post1).
        if ! [[ "$ZN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?$ ]]; then
          echo "::error title=zn-gate::'version' must be an exact zn-gate version such as 1.4.1"
          exit 2
        fi
        # A fresh virtualenv on every run, so the version and hash are always checked.
        python -I -m venv --clear "$ZN_VENV"
        if [ -x "$ZN_VENV/bin/python" ]; then
          py="$ZN_VENV/bin/python"
        else
          py="$ZN_VENV/Scripts/python.exe"
        fi
        req="$ZN_VENV/zn-gate-requirements.txt"
        if [ -n "$ZN_SHA256" ]; then
          if ! [[ "$ZN_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error title=zn-gate::'package-sha256' must be a 64-character hex SHA-256"
            exit 2
          fi
          printf 'zn-gate==%s --hash=sha256:%s\n' "$ZN_VERSION" "$ZN_SHA256" > "$req"
        else
          printf 'zn-gate==%s\n' "$ZN_VERSION" > "$req"
        fi
        # Wheel only (no build step runs), no dependencies (zn-gate has none),
        # into a private virtualenv so the workflow's own packages are untouched.
        "$py" -I -m pip install --disable-pip-version-check --no-input --no-cache-dir \
          --only-binary=:all: --no-deps -r "$req"
        installed="$("$py" -I -c 'import zn_gate; print(zn_gate.__version__)')"
        echo "Installed zn-gate $installed"
        echo "python=$py" >> "$GITHUB_OUTPUT"

    - name: Run zn-gate security scan
      id: scan
      shell: bash
      env:
        ZN_PYTHON: ${{ steps.install.outputs.python }}
        ZN_PATH: ${{ inputs.path }}
        ZN_FORMAT: ${{ inputs.format }}
        ZN_FAIL_ON_THREAT: ${{ inputs.fail-on-threat }}
      run: |
        set +e
        set -uo pipefail
        args=(scan --format "$ZN_FORMAT")
        if [ "$ZN_FAIL_ON_THREAT" = "false" ]; then
          args+=(--no-fail)
        fi
        # -I keeps files in the scanned workspace off the import path; -X utf8
        # lets the text report print on runners whose console code page is not
        # UTF-8 (Windows).
        "$ZN_PYTHON" -I -X utf8 -m zn_gate.cli "${args[@]}" -- "$ZN_PATH"
        rc=$?
        echo "scan-exit-code=$rc" >> "$GITHUB_OUTPUT"
        exit "$rc"
