# Hooks for the pre-commit framework (https://pre-commit.com).
# They run the zn-gate command line with npx, so Node.js 18 or later must be on the PATH.
# The repository has no package.json at its root, so pre-commit's own node environment
# cannot build it; npx fetches the published npm package instead. The entries name the exact
# zn-gate version that belongs to this tag, so `rev: vX.Y.Z` pins the command that runs on every
# commit. The pin moves with each release (check: .github/public-facts.json).
- id: zn-gate-scan
  name: zn-gate scan
  description: Look for prompt-injection traps and leaked secrets in prompts, markdown, skills and agent configs.
  entry: npx --yes zn-gate@1.14.0-rc.2 scan
  language: system
  pass_filenames: false
  files: '\.(md|mdx|markdown|txt|prompt|yaml|yml|json|jsonc|toml)$'
- id: zn-audit
  name: zn audit
  description: Review the repository's agent configuration (hooks, MCP servers, permissions, instructions) before anyone opens it.
  entry: npx --yes zn-gate@1.14.0-rc.2 audit
  language: system
  pass_filenames: false
  files: '(^|/)(\.claude|\.codex|\.cursor|\.gemini|\.opencode|\.amazonq|\.github|\.vscode)/|(^|/)(\.mcp\.json|AGENTS\.md|CLAUDE\.md|GEMINI\.md|opencode\.json|SKILL\.md)$'
