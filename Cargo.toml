[package]
name = "zn"
version = "1.8.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["usezn <admin@usezn.com>"]
homepage = "https://usezn.com"
repository = "https://github.com/usezn/zn"
description = "Local-first prompt-injection gate and active-defense proxy for AI agents. MCP-native."

[[bin]]
name = "zn"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "auth", "fs"] }
wasmtime = "48"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
ratatui = "0.30"
crossterm = "0.29"
cliclack = "0.2"
regex = "1.10"
uuid = { version = "1.6", features = ["v4"] }
futures = "0.3"
dashmap = "5.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
async-stream = "0.3"
hyper = { version = "1.1", features = ["full"] }
tower = "0.4"
tower_governor = "0.4"
governor = "0.6"
aho-corasick = "1.1"
reqwest = { version = "0.12", features = ["json"] }
prometheus = "0.14"
lazy_static = "1.4"
lru = "0.18.2"
hex = "0.4"
notify = "6.1"
crossbeam-channel = "0.5"
walkdir = "2.4"
tempfile = "3.27"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = "3.0"
opentelemetry = { version = "0.33", features = ["trace"] }
tracing-opentelemetry = "0.34"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
sha2 = "0.11"
rand = "0.10"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
async-trait = "0.1"
aws-config = { version = "1.11", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-sdk-kms = { version = "1.117", default-features = false, features = ["rt-tokio", "default-https-client"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = { version = "0.9.2", default-features = false }
candle-onnx = "0.9.2"
tokenizers = "0.22.2"
hf-hub = "0.4.3"
# Official MCP SDK (modelcontextprotocol/rust-sdk). Pinned exact; Apache-2.0/MIT.
# schemars needed directly: JsonSchema derive expands to `schemars::` paths.
rmcp = { version = "=3.5.1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
