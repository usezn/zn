[package]
name = "zn"
version = "1.14.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["usezn <admin@usezn.com>"]
homepage = "https://usezn.com"
repository = "https://github.com/usezn/zn"
description = "Local-first prompt-injection gate and active-defense proxy for AI agents. MCP-native."

[[bin]]
name = "zn"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "auth", "fs"] }
wasmtime = { version = "48", default-features = false, features = ["anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "component-model-async", "threads", "stack-switching", "std", "debug", "compile-time-builtins", "wit-parser"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
ratatui = "0.30"
crossterm = "0.29"
cliclack = "0.2"
regex = "1.10"
uuid = { version = "1.6", features = ["v4"] }
futures = "0.3"
dashmap = "5.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
async-stream = "0.3"
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
aho-corasick = "1.1"
reqwest = { version = "0.12", features = ["json"] }
prometheus = "0.14"
lazy_static = "1.4"
lru = "0.18.2"
hex = "0.4"
notify = "6.1"
crossbeam-channel = "0.5"
walkdir = "2.4"
tempfile = "3.27"
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.22"
ed25519-dalek = "3.0"
opentelemetry = { version = "0.33", features = ["trace"] }
tracing-opentelemetry = "0.34"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
sha2 = "0.11"
rand = "0.10"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
# The gateway only verifies HMAC (HS256) tokens. The aws-lc-rs backend is already in the tree
# (rustls), so this drops the RustCrypto RSA/P-256/P-384 stack (rsa, p256, p384, crypto-bigint).
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
async-trait = "0.1"
aws-config = { version = "1.11", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-sdk-kms = { version = "1.117", default-features = false, features = ["rt-tokio", "default-https-client"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = { version = "0.11", default-features = false }
candle-onnx = "0.11"
tokenizers = "0.22.2"
# Official MCP SDK (modelcontextprotocol/rust-sdk). Pinned exact; Apache-2.0/MIT.
# schemars needed directly: JsonSchema derive expands to `schemars::` paths.
rmcp = { version = "=3.5.1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[package.metadata.cargo-machete]
# schemars is used through the rmcp::schemars derive, which expands to schemars:: paths,
# so the crate must be a direct dependency even though no source line names it.
ignored = ["schemars"]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
