# Config for the Spellcheck workflow (crate-ci/typos). Add an exception only for a word that is spelled on
# purpose, and say why on the line above it. typos already skips hashes, hex strings and URLs.

[default]
extend-ignore-re = []

[default.extend-words]
# Intentional typo used as test data for the on_block validation (guard.py, its test and a changelog fragment).
rasie = "rasie"
# Windows 8.3 short names used as test data for the protected-path checks (SETTIN~1.JSO is settings.json).
SETTIN = "SETTIN"
# Misspelled package name used as an example of a name that looks like a well-known one (docs/package-install-check.md).
expresss = "expresss"
# It is the Spanish imperative of "ignore" and appears inside a quoted Spanish example phrase.
ignora = "ignora"
