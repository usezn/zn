command = "sh -c 'Z=$(command -v zn); N=$(command -v node); P=:$PATH:; ZD=${P#*\":${Z%/*}:\"}; ZS=${P#*\":${Z%/*}/:\"}; ND=${P#*\":${N%/*}:\"}; NS=${P#*\":${N%/*}/:\"}; T=; [ \"$ZD\" != \"$P\" ] && T=z; [ \"$ZS\" != \"$P\" ] && T=z; U=; [ \"$ND\" != \"$P\" ] && U=n; [ \"$NS\" != \"$P\" ] && U=n; NL=$(printf \"'\"\\\\\"'n_\"); NL=${NL%_}; CDPATH=; R0=; cd -P . 2>/dev/null && case $PWD in /*) R0=$PWD ;; esac; zr() { RP=; case \"$1\" in /*) ;; *) return 1 ;; esac; cd -P -- \"$1\" 2>/dev/null || return 1; RP=$PWD; cd -P -- \"$R0\" 2>/dev/null || { RP=; return 1; }; [ -n \"$RP\" ]; }; H=; zr \"${HOME:-/nonexistent}\" && H=$RP; RT=; ar() { zr \"$1\" || return 0; [ \"$RP\" = / ] && return 0; case \"$H/\" in \"$RP\"/*) return 0 ;; esac; RT=\"$RT$NL$RP\"; }; ar \"$R0\"; ar \"${CLAUDE_PROJECT_DIR:-}\"; ar \"${CURSOR_PROJECT_DIR:-}\"; D=$R0; while [ -n \"$D\" ] && [ \"$D\" != / ]; do case \"$D\" in /*) ;; *) break ;; esac; if [ -e \"$D/.git\" ]; then ar \"$D\"; break; fi; D=${D%/*}; done; zin() { O=$IFS; IFS=$NL; set -f; Q=1; for X in $RT; do case \"$1/\" in \"$X\"/*) Q=0; break ;; esac; done; set +f; IFS=$O; return $Q; }; RL=; for X in /usr/bin/readlink /bin/readlink; do [ -x \"$X\" ] && { RL=$X; break; }; done; zok() { F=$1; S=${2:-}; I=0; ZW=unresolved; while :; do zr \"${F%/*}\" || return 1; zin \"$RP\" && { ZW=inside; return 1; }; if [ \"$I\" = 0 ] || [ -n \"$S\" ]; then case \"$RP/\" in */node_modules/*) ZW=inside; return 1 ;; esac; fi; [ -L \"$F\" ] || return 0; [ -n \"$RL\" ] && [ \"$I\" -lt 40 ] || return 1; Y=$(\"$RL\" -- \"$F\") || return 1; case \"$Y\" in /*) F=$Y ;; *) F=${F%/*}/$Y ;; esac; I=$((I+1)); done; }; G=; W=gone; [ -n \"$R0\" ] && W=; [ -n \"$R0\" ] && [ -n \"$Z\" ] && [ -n \"$N\" ] && { if zok \"$Z\" && zok \"$N\" strict; then G=1; else W=$ZW; fi; }; R=missing; if [ -n \"$N\" ] && [ \"${Z#/}\" != \"$Z\" ] && [ \"${N#/}\" != \"$N\" ] && [ -n \"$T\" ] && [ -n \"$U\" ] && [ -n \"$G\" ]; then R=ran; \"$Z\" hook codex; C=$?; [ \"$C\" = 0 ] && exit 0; [ \"$C\" = 2 ] && exit 2; fi; if [ \"$R\" = ran ]; then echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook failed. Please run `zn-gate check` in your own terminal to see why.\"}'\"'\"'; exit 0; fi; if [ -n \"$N\" ] && [ \"${Z#/}\" != \"$Z\" ] && [ \"${N#/}\" != \"$N\" ] && [ -n \"$T\" ] && [ -n \"$U\" ]; then case $W in gone) echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook cannot start because the folder it runs in no longer exists or cannot be opened, so zn cannot tell which project this is. Please restart the agent from the project folder.\"}'\"'\"'; exit 0 ;; inside) echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook cannot start because the zn or Node.js found on the PATH is inside this project or a node_modules folder, and a project must not choose the program that checks it. Please put a global install (`npm install -g zn-gate`) and Node.js first on the PATH, outside the project.\"}'\"'\"'; exit 0 ;; unresolved) echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook cannot start because the zn or Node.js found on the PATH is a link zn could not follow to its real folder (no readlink, more than 40 links, or a folder that cannot be opened). Please put a plain install of zn-gate and Node.js first on the PATH.\"}'\"'\"'; exit 0 ;; esac; elif [ -n \"$Z\" ] && [ -n \"$N\" ]; then echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook cannot start because zn or Node.js was found only through a relative PATH entry (such as bin or .), which depends on the folder the agent runs in. Please keep only absolute folders in the PATH.\"}'\"'\"'; exit 0; fi; echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook cannot start because zn or Node.js was not found on the PATH. Please run `npm install -g zn-gate` in your own terminal.\"}'\"'\"'; exit 0'"
command_windows = "%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -NonInteractive -EncodedCommand "
timeout = 30
statusMessage = "zn: checking for secrets"

[[hooks.Stop]]

