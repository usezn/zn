# zn-gate hooks for Codex (zn team managed-config).

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|mcp__.+)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "sh -c 'Z=$(command -v zn); N=$(command -v node); P=:$PATH:; ZD=${P#*\":${Z%/*}:\"}; ZS=${P#*\":${Z%/*}/:\"}; ND=${P#*\":${N%/*}:\"}; NS=${P#*\":${N%/*}/:\"}; T=; [ \"$ZD\" != \"$P\" ] && T=z; [ \"$ZS\" != \"$P\" ] && T=z; U=; [ \"$ND\" != \"$P\" ] && U=n; [ \"$NS\" != \"$P\" ] && U=n; NL=$(printf \"'\"\\\\\"'n_\"); NL=${NL%_}; CDPATH=; cd -P . 2>/dev/null; R0=$PWD; zr() { RP=; case \"$1\" in /*) ;; *) return 1 ;; esac; cd -P -- \"$1\" 2>/dev/null || return 1; RP=$PWD; cd -P -- \"$R0\" 2>/dev/null || { RP=; return 1; }; [ -n \"$RP\" ]; }; H=; zr \"${HOME:-/nonexistent}\" && H=$RP; RT=; ar() { zr \"$1\" || return 0; [ \"$RP\" = / ] || [ \"$RP\" = \"$H\" ] || RT=\"$RT$NL$RP\"; }; ar \"$R0\"; ar \"${CLAUDE_PROJECT_DIR:-}\"; ar \"${CURSOR_PROJECT_DIR:-}\"; D=$R0; while [ -n \"$D\" ] && [ \"$D\" != / ]; do if [ -e \"$D/.git\" ]; then ar \"$D\"; break; fi; D=${D%/*}; done; zin() { case \"$1/\" in */node_modules/*) return 0 ;; esac; O=$IFS; IFS=$NL; set -f; Q=1; for X in $RT; do case \"$1/\" in \"$X\"/*) Q=0; break ;; esac; done; set +f; IFS=$O; return $Q; }; RL=; for X in /usr/bin/readlink /bin/readlink; do [ -x \"$X\" ] && { RL=$X; break; }; done; zok() { F=$1; I=0; while :; do zr \"${F%/*}\" || return 1; zin \"$RP\" && return 1; [ -L \"$F\" ] || return 0; [ -n \"$RL\" ] && [ \"$I\" -lt 40 ] || return 1; Y=$(\"$RL\" -- \"$F\") || return 1; case \"$Y\" in /*) F=$Y ;; *) F=${F%/*}/$Y ;; esac; I=$((I+1)); done; }; G=; [ -n \"$Z\" ] && [ -n \"$N\" ] && zok \"$Z\" && zok \"$N\" && G=1; R=missing; if [ -n \"$N\" ] && [ \"${Z#/}\" != \"$Z\" ] && [ \"${N#/}\" != \"$N\" ] && [ -n \"$T\" ] && [ -n \"$U\" ] && [ -n \"$G\" ]; then R=ran; \"$Z\" hook codex; C=$?; [ \"$C\" = 0 ] && exit 0; [ \"$C\" = 2 ] && exit 2; fi; if [ \"$R\" = ran ]; then echo '\"'\"'zn: its hook failed, so this was blocked. Ask the user to run `zn-gate check` in their terminal to see why.'\"'\"' >&2; exit 2; fi; echo '\"'\"'zn: its hook cannot start because zn or Node.js was not found on the PATH, so 