# zn-gate hooks for Codex (zn team managed-config).
allow_managed_hooks_only = true

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|mcp__.+)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "sh -c 'Z=$(command -v zn); N=$(command -v node); P=:$PATH:; ZD=${P#*\":${Z%/*}:\"}; ZS=${P#*\":${Z%/*}/:\"}; ND=${P#*\":${N%/*}:\"}; NS=${P#*\":${N%/*}/:\"}; T=; [ \"$ZD\" != \"$P\" ] && T=z; [ \"$ZS\" != \"$P\" ] && T=z; U=; [ \"$ND\" != \"$P\" ] && U=n; [ \"$NS\" != \"$P\" ] && U=n; [ \"${Z#*/node_modules/}\" != \"$Z\" ] && T=; [ \"${N#*/node_modules/}\" != \"$N\" ] && U=; R=missing; if [ -n \"$N\" ] && [ \"${Z#/}\" != \"$Z\" ] && [ \"${N#/}\" != \"$N\" ] && [ -n \"$T\" ] && [ -n \"$U\" ]; then R=ran; \"$Z\" hook codex; C=$?; [ \"$C\" = 0 ] && exit 0; [ \"$C\" = 2 ] && exit 2; fi; if [ \"$R\" = ran ]; then echo '\"'\"'zn: its hook failed, so this was blocked. Ask the user to run `zn-gate check` in their terminal to see why.'\"'\"' >&2; exit 2; fi; echo '\"'\"'zn: its hook cannot start because zn or Node.js was not found on the PATH, so this was blocked. Ask the user to run `npm install -g zn-gate` in their terminal.'\"'\"' >&2; exit 2'"
command_windows = "%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -NonInteractive -EncodedCommand "
timeout = 30
statusMessage = "zn: checking for secrets"

[[hooks.PermissionRequest]]
matcher = "^(Bash|apply_patch|mcp__.+)$"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "sh -c 'Z=$(command -v zn); N=$(command -v node); P=:$PATH:; ZD=${P#*\":${Z%/*}:\"}; ZS=${P#*\":${Z%/*}/:\"}; ND=${P#*\":${N%/*}:\"}; NS=${P#*\":${N%/*}/:\"}; T=; [ \"$ZD\" != \"$P\" ] && T=z; [ \"$ZS\" != \"$P\" ] && T=z; U=; [ \"$ND\" != \"$P\" ] && U=n; [ \"$NS\" != \"$P\" ] && U=n; [ \"${Z#*/node_modules/}\" != \"$Z\" ] && T=; [ \"${N#*/node_modules/}\" != \"$N\" ] && U=; R=missing; if [ -n \"$N\" ] && [ \"${Z#/}\" != \"$Z\" ] && [ \"${N#/}\" != \"$N\" ] && [ -n \"$T\" ] && [ -n \"$U\" ]; then R=ran; \"$Z\" hook codex; C=$?; [ \"$C\" = 0 ] && exit 0; [ \"$C\" = 2 ] && exit 2; fi; if [ \"$R\" = ran ]; then echo '\"'\"'{\"hookSpecificOutput\":{\"hookEventName\":\"PermissionRequest\",\"decision\":{\"behavior\":\"deny\",\"message\":\"zn: its hook failed, so this was blocked. Ask the user to run `zn-gate check` in their terminal to see why.\"}}}'\"'\"'; exit 0; fi; echo '\"'\"'{\"hookSpecificOutput\":{\"hookEventName\":\"PermissionRequest\",\"decision\":{\"behavior\":\"deny\",\"message\":\"zn: its hook cannot start because zn or Node.js was not found on the PATH, so this was blocked. Ask the user to run `npm install -g zn-gate` in their terminal.\"}}}'\"'\"'; exit 0'"
command_windows = "%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -NonInteractive -EncodedCommand "
timeout = 30
statusMessage = "zn: checking for secrets"

[[hooks.PostToolUse]]
matcher = ".*"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "sh -c 'Z=$(command -v zn); N=$(command -v node); P=:$PATH:; ZD=${P#*\":${Z%/*}:\"}; ZS=${P#*\":${Z%/*}/:\"}; ND=${P#*\":${N%/*}:\"}; NS=${P#*\":${N%/*}/:\"}; T=; [ \"$ZD\" != \"$P\" ] && T=z; [ \"$ZS\" != \"$P\" ] && T=z; U=; [ \"$ND\" != \"$P\" ] && U=n; [ \"$NS\" != \"$P\" ] && U=n; [ \"${Z#*/node_modules/}\" != \"$Z\" ] && T=; [ \"${N#*/node_modules/}\" != \"$N\" ] && U=; R=missing; if [ -n \"$N\" ] && [ \"${Z#/}\" != \"$Z\" ] && [ \"${N#/}\" != \"$N\" ] && [ -n \"$T\" ] && [ -n \"$U\" ]; then R=ran; \"$Z\" hook codex; C=$?; [ \"$C\" = 0 ] && exit 0; [ \"$C\" = 2 ] && exit 2; fi; if [ \"$R\" = ran ]; then echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook failed. Please run `zn-gate check` in your own terminal to see why.\"}'\"'\"'; exit 0; fi; echo '\"'\"'{\"systemMessage\":\"zn is NOT protecting this session: its hook cannot start because zn or Node.js was not found on the PATH. Please run `npm install -g zn-gate` in your own terminal.\"}'\"'\"'; exit 0'"
command_windows = "%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -NonInteractive -EncodedCommand "
timeout = 30
statusMessage = "zn: checking for secrets"

