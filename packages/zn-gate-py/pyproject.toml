[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zn-gate"
version = "1.6.0"
description = "Local security layer for Python AI agents (LangChain, CrewAI, LlamaIndex, plain tool calling): prompt-injection checks and secret redaction, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "usezn", email = "admin@usezn.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "ai-agent",
    "security",
    "prompt-injection",
    "guardrails",
    "mcp",
    "tool-calling",
    "zero-dependency",
    "llm-security"
]
dependencies = []

[project.urls]
Homepage = "https://usezn.com"
Documentation = "https://usezn.com/docs"
Repository = "https://github.com/usezn/zn"
Issues = "https://github.com/usezn/zn/issues"

[project.scripts]
zn-gate = "zn_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
